<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>恐龙考察营</title>
<style>
:root{--ink:#3b4636; --soft:#77816f; --card:#fffdf7; --green:#6fa45f; --green2:#8cc07b; --sand:#efe3c8; --shadow:0 5px 0 rgba(60,50,30,.10), 0 10px 24px rgba(60,50,30,.08);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
html,body{margin:0; height:100%; overflow:hidden; background:#eef2e4; color:var(--ink); font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif; touch-action:manipulation;}
button{font-family:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation;}
#hud{position:fixed; top:0; left:0; right:0; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; z-index:20; pointer-events:none;}
#hud > *{pointer-events:auto;}
.chip{background:rgba(255,253,247,.92); border-radius:30px; padding:8px 16px; font-size:20px; font-weight:700; box-shadow:var(--shadow); display:flex; align-items:center; gap:6px;}
.iconbtn{width:52px; height:52px; border-radius:50%; background:rgba(255,253,247,.92); font-size:24px; box-shadow:var(--shadow);}
.iconbtn:active,.btn:active,.navb:active{transform:translateY(2px);}
#hudRight{display:flex; gap:10px;}
.screen{position:fixed; top:0; left:0; right:0; bottom:84px; display:none; overflow-y:auto; overflow-x:hidden;}
.screen.show{display:block; animation:fade .45s ease;}
.screen.full{bottom:0;}
.pagepad{padding:76px 16px 24px; max-width:1000px; margin:0 auto;}
@keyframes fade{from{opacity:0} to{opacity:1}}
nav{position:fixed; left:0; right:0; bottom:0; height:84px; background:rgba(255,253,247,.96); display:flex; justify-content:center; gap:6px; padding:6px 8px 10px; box-shadow:0 -4px 20px rgba(60,50,30,.08); z-index:15;}
nav.hide{display:none;}
.navb{flex:1; max-width:170px; background:none; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:var(--soft); gap:2px;}
.navb .e{font-size:30px; line-height:1;}
.navb.on{background:#e6f0da; color:#3f6b34;}
h2{font-size:28px; margin:4px 0 6px;}
.sub{color:var(--soft); font-size:17px; margin:0 0 16px; line-height:1.6;}
.btn{background:var(--green); color:#fff; font-size:21px; font-weight:700; padding:13px 26px; border-radius:30px; box-shadow:0 4px 0 #4f8341;}
.btn.light{background:#fff; color:var(--ink); box-shadow:0 4px 0 #ddd6c4;}
.btn.blue{background:#5d93b8; box-shadow:0 4px 0 #42708f;}
.btn[disabled]{opacity:.45;}
.row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center;}
/* park */
#parkCv{position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block;}
#park{overflow:hidden;}
.parkArrow{position:absolute; top:50%; transform:translateY(-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,253,247,.75); font-size:26px; box-shadow:var(--shadow); z-index:3;}
#emptyPark{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); background:rgba(255,253,247,.94); border-radius:26px; padding:20px 26px; text-align:center; box-shadow:var(--shadow); display:none; max-width:86vw;}
#emptyPark p{font-size:20px; margin:0 0 14px; line-height:1.6;}
/* sites */
.sites{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px;}
.site{position:relative; border-radius:26px; overflow:hidden; box-shadow:var(--shadow); background:var(--card); text-align:left; padding:0;}
.site .pic{height:150px; position:relative;}
.site .pic canvas{position:absolute; inset:0; width:100%; height:100%;}
.site .info{padding:12px 16px 16px;}
.site b{font-size:24px;} .site .t{color:var(--soft); font-size:15px; margin:3px 0 8px;}
.bar{height:12px; background:#eee7d6; border-radius:8px; overflow:hidden;} .bar i{display:block; height:100%; background:#d9a948; border-radius:8px;}
.lock{position:absolute; inset:0; background:rgba(70,64,52,.72); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-size:20px; font-weight:700; text-align:center; padding:10px;}
.lock .big{font-size:40px;}
/* dig */
#digTop{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.stat{background:var(--card); border-radius:18px; padding:8px 14px; font-size:19px; font-weight:700; box-shadow:var(--shadow);}
#grid{display:grid; gap:5px; margin:0 auto; padding:10px; border-radius:22px; background:#6b5a44; box-shadow:inset 0 3px 10px rgba(0,0,0,.3), var(--shadow); touch-action:manipulation;}
.cell{aspect-ratio:1; border-radius:9px; position:relative; padding:0; font-size:clamp(18px,3.4vw,30px); font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 -4px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.25); transition:background .3s;}
.cell.open{box-shadow:inset 0 3px 8px rgba(0,0,0,.35); cursor:default;}
.cell svg{width:82%; height:82%; animation:pop .5s ease;}
@keyframes pop{from{transform:scale(.3); opacity:0} to{transform:scale(1); opacity:1}}
.n1{color:#a6dcef}.n2{color:#b9e4a0}.n3{color:#f5d27a}.n4{color:#f3b38a}.n5,.n6,.n7,.n8{color:#f0a0b8}
.hint{background:#fff7e2; border-radius:16px; padding:10px 14px; font-size:17px; line-height:1.6; margin:10px 0; box-shadow:var(--shadow);}
/* build */
#buildCv{display:block; margin:0 auto; touch-action:none; border-radius:24px; box-shadow:var(--shadow);}
#build .pagepad{position:relative;}
#buildInfo{display:none; position:absolute; left:50%; transform:translateX(-50%); bottom:24px; width:min(720px,92%); animation:fade .6s ease; max-width:720px; background:var(--card); border-radius:24px; padding:16px 20px; box-shadow:var(--shadow); text-align:center;}
#buildInfo h3{font-size:30px; margin:2px 0;}
.tags{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:8px 0;}
.tag{background:#f2eddf; border-radius:14px; padding:6px 12px; font-size:16px;}
.fact{font-size:19px; line-height:1.7; margin:8px 0 14px;}
/* dex */
.period-h{font-size:22px; font-weight:800; margin:18px 0 10px; display:flex; align-items:center; gap:10px;}
.period-h small{font-size:15px; color:var(--soft); font-weight:400;}
.dex{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;}
.dcard{background:var(--card); border-radius:22px; padding:8px 8px 10px; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center;}
.dcard canvas{width:100%;}
.dcard b{font-size:19px; margin-top:2px;}
.dcard.locked{background:#efebe0;} .dcard.locked b{color:#a8a294;}
/* quiz */
#qText{font-size:24px; font-weight:700; text-align:center; margin:6px 0 16px; line-height:1.5;}
.opts{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.opt{background:var(--card); border-radius:22px; padding:8px; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; border:4px solid transparent; transition:border-color .3s, opacity .3s;}
.opt canvas{width:100%;}
.opt b{font-size:19px; min-height:26px;}
.opt.right{border-color:#86c36f; background:#f1f9ea;}
.opt.dim{opacity:.55;}
#qFeedback{min-height:60px; text-align:center; font-size:19px; line-height:1.7; margin:14px 0;}
.dots{display:flex; gap:8px; justify-content:center; margin-bottom:8px;} .dots i{width:14px; height:14px; border-radius:50%; background:#ddd6c4;} .dots i.on{background:#d9a948;}
/* modal */
#modal{position:fixed; inset:0; background:rgba(50,45,35,.35); display:none; align-items:flex-end; justify-content:center; z-index:30;}
#modal.show{display:flex; animation:fade .3s ease;}
#sheet{background:var(--card); width:min(760px,100%); max-height:92vh; overflow-y:auto; border-radius:30px 30px 0 0; padding:18px 20px 26px; box-shadow:0 -10px 40px rgba(0,0,0,.15); animation:up .4s ease;}
@media (min-height:700px) and (min-width:700px){#modal{align-items:center;} #sheet{border-radius:30px;}}
@keyframes up{from{transform:translateY(40px)} to{transform:none}}
#sheet canvas.big{width:100%; height:240px; display:block; border-radius:20px; background:linear-gradient(#e4f0f2,#f4efdc);}
.sheetTitle{font-size:30px; font-weight:800; text-align:center; margin:8px 0 0;}
.latin{text-align:center; color:var(--soft); font-style:italic; margin-bottom:6px;}
.foods{display:flex; gap:12px; justify-content:center; margin:10px 0;}
.food{width:110px; height:96px; border-radius:22px; background:#f6f1e3; font-size:42px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 4px 0 #e2d9c2;}
.food span{font-size:16px; font-weight:700;}
.msg{text-align:center; font-size:19px; line-height:1.7; min-height:32px; margin:6px 0;}
table.data{width:100%; border-collapse:collapse; font-size:17px; margin:8px 0;}
table.data td{padding:7px 8px; border-bottom:1px solid #eee6d4;} table.data td:first-child{color:var(--soft); width:34%;}
ul.facts{padding-left:22px; font-size:18px; line-height:1.75; margin:8px 0 14px;}
#toast{position:fixed; left:50%; top:76px; transform:translateX(-50%); background:rgba(255,253,247,.97); border-radius:20px; padding:10px 20px; font-size:19px; font-weight:700; box-shadow:var(--shadow); z-index:40; opacity:0; transition:opacity .5s; pointer-events:none; text-align:center; max-width:90vw;}
#toast.show{opacity:1;}
@media (max-width:560px){ .opts{gap:8px;} .opt b{font-size:15px;} .food{width:92px;} h2{font-size:24px;} }
</style>
</head>

<div id="hud">
  <div class="chip" id="ptsChip">🔬 <span id="pts">0</span></div>
  <div id="hudRight"><button class="iconbtn" id="sndBtn" aria-label="声音">🔇</button><button class="iconbtn" id="setBtn" aria-label="设置">⚙️</button></div>
</div>

<!-- 乐园 -->
<section class="screen" id="park">
  <canvas id="parkCv"></canvas>
  <button class="parkArrow" id="panL" style="left:10px">◀</button>
  <button class="parkArrow" id="panR" style="right:10px">▶</button>
  <div id="emptyPark"><p>🏞️ 恐龙乐园还空着呢。<br>去<b>考察</b>挖化石，把恐龙请回来吧！</p><button class="btn" data-tab="sites">去考察 ⛏️</button></div>
</section>

<!-- 考察地 -->
<section class="screen" id="sites"><div class="pagepad">
  <h2>⛏️ 选择考察地</h2>
  <p class="sub">不同的岩层来自不同的年代。越深、越古老的岩层，要用研究点解锁。<br>喂恐龙、答题、挖到宝贝，都能得到研究点 🔬</p>
  <div class="sites" id="siteList"></div>
</div></section>

<!-- 挖掘 -->
<section class="screen full" id="dig"><div class="pagepad" style="max-width:760px">
  <div id="digTop">
    <button class="btn light" id="digBack">◀ 返回</button>
    <div class="row"><div class="stat" id="digBones">🦴 0/6</div><div class="stat" id="digTaps">⛏️ 0 锤</div></div>
  </div>
  <div class="hint" id="digHint">点一下石块就能敲开。<b>数字</b>告诉你：它周围的 8 格里藏着几块骨头。用数字推理，少敲几锤就能找全 6 块骨头！</div>
  <div id="grid"></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="toBuild" style="display:none">拼骨架 ➜</button></div>
</div></section>

<!-- 拼骨架 -->
<section class="screen full" id="build"><div class="pagepad" style="max-width:1040px; padding-top:72px">
  <div class="row" style="justify-content:space-between; margin-bottom:8px"><button class="btn light" id="buildBack">◀ 返回</button><div class="stat" id="buildTip">把骨头拖到虚线框里对应的位置</div></div>
  <canvas id="buildCv"></canvas>
  <div id="buildInfo"></div>
</div></section>

<!-- 图鉴 -->
<section class="screen" id="dex"><div class="pagepad">
  <h2>📖 恐龙图鉴</h2>
  <p class="sub" id="dexSub"></p>
  <div id="dexList"></div>
</div></section>

<!-- 问答 -->
<section class="screen" id="quiz"><div class="pagepad" style="max-width:820px">
  <h2>❓ 恐龙知识问答</h2>
  <div id="quizBody"></div>
</div></section>

<nav id="nav">
  <button class="navb on" data-tab="park"><span class="e">🏞️</span>乐园</button>
  <button class="navb" data-tab="sites"><span class="e">⛏️</span>考察</button>
  <button class="navb" data-tab="dex"><span class="e">📖</span>图鉴</button>
  <button class="navb" data-tab="quiz"><span class="e">❓</span>问答</button>
</nav>

<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>

/* ============ 主绘制 ============ */
function drawDino(ctx,sp,o={}){
  const mode=o.mode||'live', pal=palette(sp,mode), t=o.t||0, ph=o.phase||0, mv=!!o.moving;
  const S=sample(pose(sp,o));
  const feats=sp.feats||[];
  const gaitOff = sp.gait==='quad'? [[0,Math.PI],[Math.PI,0]] : [[0,Math.PI]];
  ctx.save(); ctx.lineJoin='round';
  // 远侧肢体
  const legs=(sp.legs||[]).map((L,j)=>({L, near:legGeom(S,L,ph+gaitOff[j]?.[0]||0,mv,false), far:legGeom(S,L,ph+(gaitOff[j]?.[1]??Math.PI),mv,true)}));
  if(sp.gait==='fly') wing(ctx,S,sp,pal,t,true);
  legs.forEach(g=>drawLeg(ctx,g.far,g.L,pal.limbFar,pal.line,pal));
  (sp.arms||[]).forEach(A=>{const g=armGeom(S,A,t+1); g.s.x-=3; g.e.x-=3; g.h.x-=3; drawArm(ctx,g,A,pal.limbFar,pal.line,pal);});
  feats.forEach(f=>featBack(ctx,S,sp,pal,f));
  // 身体
  bodyPath(ctx,S);
  let minY=1e9,maxY=-1e9; S.forEach(p=>{minY=Math.min(minY,p.y-p.wt); maxY=Math.max(maxY,p.y+p.wb);});
  if(pal.sil) ctx.fillStyle=pal.base; else {const g=ctx.createLinearGradient(0,minY,0,maxY); g.addColorStop(0,pal.dark); g.addColorStop(0.45,pal.base); g.addColorStop(0.8,pal.belly); g.addColorStop(1,pal.belly); ctx.fillStyle=g;}
  ctx.fill();
  if(!pal.sil){
    ctx.save(); bodyPath(ctx,S); ctx.clip();
    if(!pal.fossil) pattern(ctx,S,sp,pal);
    // 体积感：内阴影 + 背部高光
    bodyPath(ctx,S); ctx.strokeStyle='rgba(50,35,20,.16)'; ctx.lineWidth=9; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath();
    smoothTo(ctx,S.slice(Math.floor(PER*0.6),Math.floor((sp.neck+1)*PER)).map(p=>({x:p.x+p.nx*(p.wt*0.7),y:p.y+p.ny*(p.wt*0.7)})),true); ctx.stroke();
    if(pal.fossil) fossilMarks(ctx,S,sp);
    ctx.restore();
  }
  bodyPath(ctx,S); ctx.strokeStyle=pal.line; ctx.lineWidth=pal.sil?1.5:2.2; ctx.stroke();
  feats.forEach(f=>featFront(ctx,S,sp,pal,f));
  // 近侧肢体

  (sp.arms||[]).forEach(A=>drawArm(ctx,armGeom(S,A,t),A,pal.limb,pal.line,pal));
  if(sp.gait==='fly') wing(ctx,S,sp,pal,t,false);
  // 脸
  if(!pal.sil) face(ctx,S,sp,pal,t);
  ctx.restore();
}
function fossilMarks(ctx,S,sp){

  for(let j=2;j<end;j+=3){const p=S[j], r=Math.max(1.2,Math.min(2.6,(p.wt+p.wb)*0.07)); ctx.beginPath(); ctx.ellipse(p.x,p.y-p.wt*0.25,r*1.3,r,Math.atan2(p.ty,p.tx),0,Math.PI*2); ctx.fill();}

  for(let s=sp.hipIdx-0.4;s<sp.neck-0.3;s+=0.28){const f=F(S,s), a=P(f,0,-f.wt*0.25), c=P(f,4,-f.wb*0.6), b=P(f,-1,-f.wb*0.85);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(c.x,c.y,b.x,b.y); ctx.stroke();}

    ctx.strokeStyle=pal.line; ctx.lineWidth=1.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.quadraticCurveTo(m.x,m.y,a.x,a.y);

  ctx.fillStyle='#fffdf5'; ctx.beginPath(); ctx.ellipse(c.x,c.y,r*1.12,r,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=pal.line; ctx.lineWidth=1.1; ctx.stroke();
  ctx.fillStyle=pal.eye||'#d6a03c'; ctx.beginPath(); ctx.arc(c.x+r*0.22,c.y+r*0.05,r*0.74,0,Math.PI*2); ctx.fill();

function wing(ctx,S,sp,pal,t,far){
  const W=sp.wing, f=F(S,W.i), sh=P(f,2,1), hip=P(F(S,W.hip),0,-2), up=Math.sin(t*2.2)*(far?0.9:1);

  if(!pal.sil){const g=ctx.createLinearGradient(sh.x,sh.y,tip.x,tip.y); g.addColorStop(0,far?shade(col,0.72):shade(col,0.92)); g.addColorStop(1,far?shade(col,0.82):shade(col,1.12)); ctx.fillStyle=g;} else ctx.fillStyle=pal.accent;

  if(!pal.sil){ctx.strokeStyle=pal.line; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.quadraticCurveTo((sh.x+wrist.x)/2,wrist.y+4,wrist.x,wrist.y);
    ctx.quadraticCurveTo((wrist.x+tip.x)/2,(wrist.y+tip.y)/2-10*up-4,tip.x,tip.y); ctx.stroke();
    ctx.strokeStyle='rgba(80,50,30,.15)'; ctx.lineWidth=1.2; for(let k=1;k<4;k++){const q=k/4; line(ctx,{x:wrist.x+(tip.x-wrist.x)*q,y:wrist.y+(tip.y-wrist.y)*q-3},{x:hip.x+(mid.x-hip.x)*q*1.4,y:hip.y+(mid.y-hip.y)*q*1.4});}}

/* ============ 包围盒与适配绘制 ============ */
const BBOX={};
function bbox(sp){
  if(BBOX[sp.id]) return BBOX[sp.id];
  const c=document.createElement('canvas'); c.width=700; c.height=520; const x=c.getContext('2d');
  x.translate(220,400);
  const ts = sp.gait==='fly'? [0,0.7,1.4,2.1] : [0];
  ts.forEach(t=>drawDino(x,sp,{t:t, mode:'sil'}));
  const d=x.getImageData(0,0,700,520).data; let x0=700,y0=520,x1=0,y1=0;
  for(let yy=0;yy<520;yy+=2) for(let xx=0;xx<700;xx+=2){if(d[(yy*700+xx)*4+3]>10){if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy;}}
  return BBOX[sp.id]={x:x0-220-4,y:y0-400-4,w:x1-x0+8,h:y1-y0+8};
}
function fitDraw(ctx,sp,cw,ch,o={},pad=8){
  const b=bbox(sp), s=Math.min((cw-pad*2)/b.w,(ch-pad*2)/b.h);
  ctx.save(); ctx.translate((cw-b.w*s)/2 - b.x*s, (ch-b.h*s)/2 - b.y*s); ctx.scale(s,s);
  if(sp.gait!=='fly' && (o.mode||'live')==='live'){ctx.fillStyle='rgba(60,50,30,.13)'; ctx.beginPath(); ctx.ellipse(b.x+b.w*0.55,0,b.w*0.36,5,0,0,Math.PI*2); ctx.fill();}
  drawDino(ctx,sp,o); ctx.restore(); return s;
}

const PK={cv:$('parkCv'), ctx:null, w:0, h:0, W:0, camX:0, vel:0, dinos:[], parts:[], smoke:[], scene:null, last:0, drag:null};

function rnd(a,b,r=Math.random){return a+(b-a)*r();}
function buildScene(){
  const R=seeded(7), w=PK.w, h=PK.h, W=PK.W, hz=h*0.5;
  const sc={hz};
  sc.far=[]; for(let x=-40;x<=W*0.3+w+80;x+=46){sc.far.push({x, y:hz-h*0.12-Math.sin(x*0.006)*h*0.05-R()*h*0.05});}

  sc.lake={x:W*0.42, y:h*0.63, rx:Math.min(300,w*0.3), ry:h*0.04};

  sc.tufts=[]; for(let i=0;i<W/14;i++) sc.tufts.push({x:R()*W, y:hz+h*0.08+R()*h*0.42, s:0.6+R()*0.8, c:R()});
  sc.rocks=[]; for(let i=0;i<W/260;i++) sc.rocks.push({x:R()*W, y:h*0.7+R()*h*0.26, r:6+R()*14});
  sc.flowers=[]; for(let i=0;i<W/60;i++) sc.flowers.push({x:R()*W, y:hz+h*0.1+R()*h*0.4, c:['#f6d36b','#f3a6b7','#ffffff','#c7a6e8'][Math.floor(R()*4)]});
  sc.front=[]; for(let x=0;x<W*1.15+w;x+=rnd(160,320,R)) sc.front.push({x, s:Math.min(h,w*0.8)*0.0035*(0.8+R()*0.5), type:R()<0.6?'fernf':'cycadf'});

/* ---------- 植物 ---------- */
function frond(x,ctx,len,ang,droop,col,leaf){
  const ex=Math.cos(ang)*len, ey=Math.sin(ang)*len, cx=ex*0.5, cy=ey*0.5-len*0.18+droop*len*0.25;
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,len*0.035); ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(cx,cy,ex,ey+droop*len*0.35); ctx.stroke();
  ctx.lineWidth=Math.max(1,len*0.03);
  for(let k=2;k<12;k++){const t=k/12, px=2*(1-t)*t*cx+t*t*ex, py=2*(1-t)*t*cy+t*t*(ey+droop*len*0.35), l=leaf*(1-t*0.7);
    const a=ang+Math.PI/2; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(a-0.6)*l,py+Math.sin(a-0.6)*l+l*0.3); ctx.moveTo(px,py); ctx.lineTo(px-Math.cos(a+0.6)*l,py-Math.sin(a+0.6)*l+l*0.3); ctx.stroke();}
}
function drawPlant(ctx,type,s){
  ctx.save(); ctx.scale(s,s); ctx.lineCap='round';
  if(type==='arau'){ // 南洋杉
    ctx.strokeStyle='#6d5238'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-150); ctx.stroke();
    const greens=['#4f7d4a','#5f8f55','#6e9f62'];
    for(let k=0;k<5;k++){const y=-150+k*10-28, w=26+k*10; ctx.fillStyle=greens[k%3];
      ctx.beginPath(); ctx.ellipse(0,y+28,w,12,0,0,Math.PI*2); ctx.fill();}
    ctx.fillStyle='#7aab6a'; ctx.beginPath(); ctx.ellipse(-6,-126,20,8,0,0,Math.PI*2); ctx.fill();
  } else if(type==='cycad'){ // 苏铁
    const g=ctx.createLinearGradient(-12,0,12,0); g.addColorStop(0,'#7a5a3a'); g.addColorStop(1,'#a07850'); ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(-12,0); ctx.lineTo(-9,-44); ctx.lineTo(9,-44); ctx.lineTo(12,0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(60,40,20,.35)'; ctx.lineWidth=1.2; for(let y=-6;y>-44;y-=7){ctx.beginPath(); ctx.moveTo(-11,y); ctx.lineTo(0,y-4); ctx.lineTo(11,y); ctx.stroke();}
    ctx.translate(0,-46); for(let k=0;k<9;k++){const a=-Math.PI+0.15+k*(Math.PI-0.3)/8; frond(0,ctx,52,a,Math.abs(Math.cos(a))*0.8,k%2?'#5e8f4a':'#4a7a3c',9);}
  } else if(type==='fern'){ // 树蕨
    ctx.strokeStyle='#5d4a35'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(6,-60,0,-110); ctx.stroke();
    ctx.translate(0,-112); for(let k=0;k<8;k++){const a=-Math.PI+0.25+k*(Math.PI-0.5)/7; frond(0,ctx,58,a,1.1,k%2?'#6a9b4f':'#578a42',8);}
  } else if(type==='bush'){
    [['#5a8a4c',-18,-14,24],['#6c9d5a',14,-16,22],['#78aa63',-2,-28,24],['#4f7d44',0,-10,26]].forEach(([c,x,y,r])=>{ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();});
  } else if(type==='fernf'){ for(let k=0;k<7;k++){const a=-Math.PI+0.3+k*(Math.PI-0.6)/6; frond(0,ctx,80,a,0.9,k%2?'#3f6e3a':'#4c7f42',11);} }
  else if(type==='cycadf'){ for(let k=0;k<9;k++){const a=-Math.PI+0.2+k*(Math.PI-0.4)/8; frond(0,ctx,70,a,0.6,k%2?'#476f3a':'#3b6232',10);} }
  ctx.restore();
}
function plantSprite(type,s){
  const key=type+'_'+s.toFixed(2); if(PK.sprites[key]) return PK.sprites[key];
  const d=DPR(), w=Math.ceil(240*s), h=Math.ceil(220*s), c=document.createElement('canvas'); c.width=w*d; c.height=h*d;

/* ---------- 背景 ---------- */
function ridge(ctx,pts,off,base,fill){ctx.beginPath(); ctx.moveTo(pts[0].x-off,base); pts.forEach(p=>ctx.lineTo(p.x-off,p.y)); ctx.lineTo(pts[pts.length-1].x-off,base); ctx.closePath(); ctx.fillStyle=fill; ctx.fill();}
function drawScene(ctx,t){
  const sc=PK.scene, w=PK.w, h=PK.h, cx=PK.camX, hz=sc.hz;
  let g=ctx.createLinearGradient(0,0,0,hz); g.addColorStop(0,'#9fcbe0'); g.addColorStop(0.7,'#d7e8e2'); g.addColorStop(1,'#f4e8cc'); ctx.fillStyle=g; ctx.fillRect(0,0,w,hz+4);
  // 太阳
  const sx=w*0.82-cx*0.05, sy=h*0.14; g=ctx.createRadialGradient(sx,sy,4,sx,sy,h*0.16); g.addColorStop(0,'rgba(255,246,214,.95)'); g.addColorStop(0.25,'rgba(255,240,200,.55)'); g.addColorStop(1,'rgba(255,240,200,0)'); ctx.fillStyle=g; ctx.fillRect(sx-h*0.2,sy-h*0.2,h*0.4,h*0.4);

    [[0,0,40],[34,6,30],[-34,8,28],[12,-14,28]].forEach(([dx,dy,r])=>{ctx.beginPath(); ctx.ellipse(x+dx*c.s,c.y+dy*c.s,r*c.s*1.3,r*c.s*0.8,0,0,Math.PI*2); ctx.fill();});});
  // 远山与火山
  ridge(ctx,sc.far,cx*0.3,hz+2,'#a9bfcc');
  const v=sc.volc, vx=v.x-cx*0.3;
  ctx.fillStyle='#9a8f9a'; ctx.beginPath(); ctx.moveTo(vx-v.bw,hz); ctx.lineTo(vx-v.bw*0.16,v.y); ctx.quadraticCurveTo(vx,v.y+6,vx+v.bw*0.16,v.y); ctx.lineTo(vx+v.bw,hz); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#86798a'; ctx.beginPath(); ctx.moveTo(vx+v.bw*0.16,v.y); ctx.lineTo(vx+v.bw,hz); ctx.lineTo(vx+v.bw*0.3,hz); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(240,170,110,.55)'; ctx.beginPath(); ctx.ellipse(vx,v.y+2,v.bw*0.15,4,0,0,Math.PI*2); ctx.fill();
  PK.smoke.forEach(p=>{ctx.fillStyle=`rgba(235,232,228,${p.a})`; ctx.beginPath(); ctx.arc(p.x-cx*0.3,p.y,p.r,0,Math.PI*2); ctx.fill();});
  ridge(ctx,sc.far2,cx*0.3,hz+2,'#93b3a3');
  // 中景丘陵
  g=ctx.createLinearGradient(0,hz-h*0.1,0,hz+h*0.05); g.addColorStop(0,'#9cc58a'); g.addColorStop(1,'#88b675');
  ridge(ctx,sc.hills,cx*0.6,hz+h*0.08,g);
  // 地面
  g=ctx.createLinearGradient(0,hz,0,h); g.addColorStop(0,'#a9cd7d'); g.addColorStop(0.5,'#9cc56d'); g.addColorStop(1,'#8ab85e'); ctx.fillStyle=g; ctx.fillRect(0,hz+h*0.02,w,h);
  // 小路
  ctx.fillStyle='rgba(222,200,150,.55)'; ctx.beginPath(); ctx.moveTo(-10,h*0.86); for(let x=0;x<=w+20;x+=20){const wx=x+cx; ctx.lineTo(x,h*0.84+Math.sin(wx*0.004)*h*0.03);} for(let x=w+20;x>=-10;x-=20){const wx=x+cx; ctx.lineTo(x,h*0.89+Math.sin(wx*0.004)*h*0.03);} ctx.closePath(); ctx.fill();
  // 湖
  const L=sc.lake, lx=L.x-cx;
  if(lx>-L.rx*1.5 && lx<w+L.rx*1.5){
    ctx.fillStyle='#8fae6a'; ctx.beginPath(); ctx.ellipse(lx,L.y+3,L.rx+10,L.ry+6,0,0,Math.PI*2); ctx.fill();
    g=ctx.createLinearGradient(0,L.y-L.ry,0,L.y+L.ry); g.addColorStop(0,'#9fd0de'); g.addColorStop(1,'#6fb0c8'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(lx,L.y,L.rx,L.ry,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; ctx.lineCap='round';

/* ---------- 乐园里的恐龙 ---------- */
function unitPx(){return Math.min(PK.h,PK.w*0.8)*0.00155;}
function placeY(d){
  if(d.sp.gait==='fly'){d.y=PK.h*(0.14+Math.random()*0.16); return;}
  d.y=PK.h*(0.64+d.lane*0.26);
}
function addParkDino(id,enter){
  const sp=SP[id]; if(PK.dinos.some(d=>d.sp.id===id)) return;
  const d={sp, lane:Math.random(), x:enter? PK.camX+PK.w+120 : 150+Math.random()*(PK.W-300), dir:enter?-1:(Math.random()<0.5?-1:1), st:'walk', timer:0, phase:Math.random()*6, t0:Math.random()*20, tx:0, hop:0};
  placeY(d); d.tx = enter? PK.camX+PK.w*0.6 : pickTarget(d); PK.dinos.push(d);
}
function pickTarget(d){return Math.max(120,Math.min(PK.W-120, d.x+(Math.random()<0.5?-1:1)*(150+Math.random()*450)));}
function depth(d){return d.sp.gait==='fly'?0.85:0.72+0.28*d.lane;}
function dinoScale(d){return unitPx()*d.sp.size*depth(d);}
function updateDinos(dt){
  for(const d of PK.dinos){
    const k=dinoScale(d), speed=(d.sp.gait==='fly'?60:26+d.sp.size*14)*depth(d);
    if(d.sp.gait==='fly'){d.x+=d.dir*speed*dt; d.phase+=dt*3; if(d.x>PK.W+200) d.dir=-1; if(d.x<-200) d.dir=1; continue;}
    if(d.st==='walk'){
      const dx=d.tx-d.x; d.dir=dx>0?1:-1; d.x+=d.dir*Math.min(Math.abs(dx),speed*dt);
      d.phase+=dt*speed/(k*(d.sp.legs[0].l1+d.sp.legs[0].l2)*0.55);
      if(Math.abs(dx)<2){d.st='idle'; d.timer=3+Math.random()*5;}
    } else { d.timer-=dt; if(d.timer<=0){d.st='walk'; d.tx=pickTarget(d);} }
    if(d.hop>0) d.hop=Math.max(0,d.hop-dt);
  }
}
function drawParkDino(ctx,d,t){
  const k=dinoScale(d), sx=d.x-PK.camX; const b=bbox(d.sp);
  if(sx<-b.w*k-50 || sx>PK.w+b.w*k+50) return;
  const hopY = d.hop>0 ? -Math.abs(Math.sin(d.hop*Math.PI*2))*10 : 0;
  ctx.save(); ctx.translate(sx,d.y);
  if(d.sp.gait!=='fly'){ctx.fillStyle='rgba(50,60,30,.18)'; ctx.beginPath(); ctx.ellipse(d.dir*(b.x+b.w*0.55)*k,2,b.w*0.36*k,6*k*1.4,0,0,Math.PI*2); ctx.fill();}
  else {ctx.translate(0,Math.sin(t*0.8+d.t0)*12);}
  ctx.translate(0,hopY); ctx.scale(d.dir*k,k);
  drawDino(ctx,d.sp,{t:t+d.t0, moving:d.st==='walk'&&d.sp.gait!=='fly', phase:d.phase});
  ctx.restore();
}
function hitDino(px,py){
  const list=PK.dinos.slice().sort((a,b)=>b.y-a.y);
  for(const d of list){const k=dinoScale(d), b=bbox(d.sp), sx=d.x-PK.camX, fy=d.sp.gait==='fly'?Math.sin(PK.t*0.8+d.t0)*12:0;
    const x0=d.dir>0? sx+b.x*k : sx-(b.x+b.w)*k, y0=d.y+fy+b.y*k;
    if(px>=x0-10 && px<=x0+b.w*k+10 && py>=y0-10 && py<=y0+b.h*k+10) return d;}
  return null;
}
function parkFrame(ts){

  if(!PK.drag && Math.abs(PK.vel)>0.5){PK.camX-=PK.vel*dt; PK.vel*=Math.pow(0.04,dt);}

  PK.smoke.forEach(p=>{p.y-=dt*7; p.x+=dt*4; p.r+=dt*2.4; p.a-=dt*0.045;}); PK.smoke=PK.smoke.filter(p=>p.a>0);

const DG={};
function startDig(pid){
  const order=SITE_ORDER[pid], next=order.find(id=>!has(id));
  const C=9, R=6, N=6;
  Object.assign(DG,{pid, sp: next||order[Math.floor(Math.random()*order.length)], C, R, N, taps:0, bones:0, done:false, bonusGot:0, cells:Array.from({length:C*R},()=>({bone:false,bonus:null,open:false}))});

    DG.cells.forEach(c=>c.open=true); renderGrid(false);
    addPts(stars*5,`${'⭐'.repeat(stars)} 化石全部找到了！`);
    $('digHint').innerHTML=`🎉 太棒了！你用 <b>${DG.taps}</b> 锤找到了全部 ${DG.N} 块骨头，得到 ${'⭐'.repeat(stars)}。<br>${stars<3?'小技巧：数字为 0 的地方旁边一定没有骨头；骨头通常连在一起。':'你是推理高手！'}　现在把骨头拼起来，看看是什么恐龙吧。`;
    $('toBuild').style.display='inline-block'; sHappy();
  },500);
}
$('toBuild').onclick=()=>startBuild(DG.sp);
$('digBack').onclick=()=>show('sites');

/* =================== 拼骨架 =================== */
const BD={};
function startBuild(id){
  show('build'); const sp=SP[id], cv=$('buildCv');
  $('buildInfo').style.display='none'; $('buildTip').textContent='把骨头拖到虚线框里对应的位置';
  const cw=Math.min(window.innerWidth-24,1000), ch=Math.max(360,Math.min(window.innerHeight-150,700));
  const ctx=sizeCanvas(cv,cw,ch), b=bbox(sp), areaH=ch*0.56;
  const sc=Math.min(cw*0.84/b.w, areaH*0.86/b.h), pad=6, ow=Math.ceil(b.w*sc+pad*2), oh=Math.ceil(b.h*sc+pad*2), d=DPR();
  const mk=(mode)=>{const c=document.createElement('canvas'); c.width=ow*d; c.height=oh*d; const x=c.getContext('2d'); x.scale(d,d); x.translate(pad-b.x*sc,pad-b.y*sc); x.scale(sc,sc); drawDino(x,sp,{mode}); return c;};
  const fossil=mk('fossil'), ghost=mk('sil');
  const ix=(cw-ow)/2, iy=(areaH-oh)/2+6, N=6, pw=ow/N;
  const trayY=areaH+8, trayH=ch-trayY-8, ts=Math.min(1,(trayH-16)/oh,(cw-20-(N-1)*10)/ow);
  const order=shuffle([...Array(N).keys()]); let tx=(cw-(ow*ts+(N-1)*10))/2;
  const pieces=[...Array(N).keys()].map(k=>({k, sx:k*pw, tx:ix+k*pw, ty:iy, x:0, y:0, s:ts, placed:false}));
  order.forEach(k=>{const p=pieces[k]; p.x=tx; p.y=trayY+(trayH-oh*ts)/2; tx+=pw*ts+10;});
  Object.assign(BD,{sp,cv,ctx,cw,ch,fossil,ghost,ix,iy,ow,oh,pw,pieces,ts,trayY,trayH,drag:null,phase:'build',t0:0,sc,pad,b,areaH});
  cancelAnimationFrame(BD.raf); BD.raf=requestAnimationFrame(buildFrame);
}
function buildFrame(ts){
  if(cur!=='build') return; BD.raf=requestAnimationFrame(buildFrame);
  const {ctx,cw,ch,ix,iy,ow,oh,pw}=BD, t=ts/1000; d=DPR();
  ctx.clearRect(0,0,cw,ch);
  let g=ctx.createLinearGradient(0,0,0,ch); g.addColorStop(0,'#f6efdc'); g.addColorStop(1,'#eadfc4'); ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(0,0,cw,ch,24); ctx.fill();
  if(BD.phase==='build'){
    ctx.fillStyle='rgba(120,100,70,.10)'; ctx.beginPath(); ctx.roundRect(8,BD.trayY,cw-16,BD.trayH,18); ctx.fill();
    ctx.globalAlpha=0.5; ctx.drawImage(BD.ghost,ix,iy,ow,oh); ctx.globalAlpha=1;
    ctx.setLineDash([8,8]); ctx.strokeStyle='rgba(140,115,80,.45)'; ctx.lineWidth=2;
    for(let k=0;k<6;k++){ if(BD.pieces[k].placed) continue; ctx.strokeRect(ix+k*pw+2,iy+2,pw-4,oh-4);} ctx.setLineDash([]);
    const list=BD.pieces.filter(p=>p.placed).concat(BD.pieces.filter(p=>!p.placed&&p!==BD.drag)); if(BD.drag) list.push(BD.drag);
    list.forEach(p=>{const w=pw*p.s, h=oh*p.s; ctx.save(); if(p===BD.drag){ctx.shadowColor='rgba(60,40,20,.3)'; ctx.shadowBlur=18; ctx.shadowOffsetY=8;}
      const x=p.placed?p.tx:p.x, y=p.placed?p.ty:p.y;
      if(!p.placed){ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.roundRect(x,y,w,h,10); ctx.fill();}
      ctx.drawImage(BD.fossil,p.sx*d,0,pw*d,oh*d,x,y,w,h); ctx.restore();});
  } else {
    const k=Math.min(1,(t-BD.t0)/1.8);
    ctx.globalAlpha=1-k; ctx.drawImage(BD.fossil,ix,iy,ow,oh); ctx.globalAlpha=k;
    ctx.save(); ctx.translate(ix+BD.pad-BD.b.x*BD.sc, iy+BD.pad-BD.b.y*BD.sc); ctx.scale(BD.sc,BD.sc);
    ctx.fillStyle='rgba(60,50,30,.12)'; ctx.beginPath(); ctx.ellipse(BD.b.x+BD.b.w*0.55,0,BD.b.w*0.36,5,0,0,Math.PI*2); ctx.fill();
    drawDino(ctx,BD.sp,{t:t}); ctx.restore(); ctx.globalAlpha=1;
    if(k<1){ctx.fillStyle=`rgba(255,250,220,${0.5*Math.sin(k*Math.PI)})`; ctx.beginPath(); ctx.roundRect(0,0,cw,ch,24); ctx.fill();}
  }
}
var d=1;
(function buildInput(){
  const cv=$('buildCv'); let off=null;
  const pos=e=>{const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.addEventListener('pointerdown',e=>{if(BD.phase!=='build') return; const m=pos(e);
    const cands=BD.pieces.filter(p=>!p.placed).reverse(); for(const p of cands){const w=BD.pw*p.s,h=BD.oh*p.s; if(m.x>=p.x&&m.x<=p.x+w&&m.y>=p.y&&m.y<=p.y+h){
      const fx=(m.x-p.x)/w, fy=(m.y-p.y)/h; p.s=1; off={x:fx*BD.pw,y:fy*BD.oh}; p.x=m.x-off.x; p.y=m.y-off.y; BD.drag=p; cv.setPointerCapture(e.pointerId); sTap(); break;}}});
  cv.addEventListener('pointermove',e=>{if(!BD.drag) return; const m=pos(e); BD.drag.x=m.x-off.x; BD.drag.y=m.y-off.y;});
  const up=()=>{const p=BD.drag; if(!p) return; BD.drag=null;
    if(Math.hypot(p.x-p.tx,p.y-p.ty)<Math.max(50,BD.pw*0.6)){p.placed=true; sFind(); if(BD.pieces.every(q=>q.placed)) buildDone();}};
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
})();
function buildDone(){
  const sp=BD.sp, isNew=!has(sp.id);
  $('buildTip').textContent='骨架拼好了！';
  setTimeout(()=>{BD.phase='reveal'; BD.t0=performance.now()/1000; sHappy();},500);
  if(isNew){ST.found.push(sp.id); save(); addPts(10);}
  setTimeout(()=>{
    const f=sp.facts[Math.floor(Math.random()*sp.facts.length)];
    $('buildInfo').innerHTML=`<h3>${isNew?'🎉 新发现：':'又是一具'}${sp.name}${isNew?'！':'化石'}</h3><div class="latin">${sp.latin}</div>
      <div class="tags"><span class="tag">🕰️ ${PERIODS[sp.period].name}</span><span class="tag">📏 ${sp.len}</span><span class="tag">⚖️ ${sp.wt}</span><span class="tag">🍽️ ${sp.dietTxt}</span><span class="tag">📍 ${sp.place}</span></div>
      <div class="fact">💡 ${f}</div>
      <div class="row">${isNew?'<button class="btn" id="sendPark">送它去乐园 ➜</button>':'<button class="btn" id="sendPark">回到乐园</button>'}<button class="btn light" id="digAgain">再去考察</button></div>`;
    $('buildInfo').style.display='block';
    say((isNew?'新发现，':'')+sp.name+'。'+f);
    $('sendPark').onclick=()=>{show('park'); if(isNew){PK.dinos=PK.dinos.filter(x=>x.sp.id!==sp.id); addParkDino(sp.id,true); toast(`${sp.name}住进了恐龙乐园！`);}};
    $('digAgain').onclick=()=>show('sites');
  },2300);
}
$('buildBack').onclick=()=>show('sites');

/* =================== 图鉴 =================== */
function renderDex(){
  $('dexSub').textContent=`已发现 ${ST.found.length} / ${SPECIES.length} 种。灰色的还没找到，去对应年代的考察地挖挖看吧！`;
  const L=$('dexList'); L.innerHTML='';
  ['tri','jur','cre'].forEach(pid=>{
    const h=document.createElement('div'); h.className='period-h'; h.innerHTML=`${PERIODS[pid].name} <small>${PERIODS[pid].time}</small>`; L.appendChild(h);
    const g=document.createElement('div'); g.className='dex'; L.appendChild(g);
    SPECIES.filter(s=>s.period===pid).forEach(sp=>{const ok=has(sp.id), c=document.createElement('button'); c.className='dcard'+(ok?'':' locked');
      c.appendChild(miniCanvas(sp,ok?'live':'sil')); const b=document.createElement('b'); b.textContent=ok?sp.name:'？？？'; c.appendChild(b);
      c.onclick=()=>ok? showDetail(sp) : toast(`在${PERIODS[pid].name}考察地可以找到它`); g.appendChild(c);});

}
function showDetail(sp){
  openModal(`<canvas class="big" id="detCv"></canvas><div class="sheetTitle">${sp.name}</div><div class="latin">${sp.latin}</div>
    <table class="data"><tr><td>生活年代</td><td>${PERIODS[sp.period].name}（${PERIODS[sp.period].time}）</td></tr><tr><td>体长</td><td>${sp.len}</td></tr><tr><td>体重</td><td>${sp.wt}</td></tr><tr><td>食物</td><td>${sp.dietTxt}</td></tr><tr><td>化石发现地</td><td>${sp.place}</td></tr></table>
    <ul class="facts">${sp.facts.map(f=>`<li>${f}</li>`).join('')}</ul>
    <div class="row"><button class="btn blue" id="readBtn">🔊 读给我听</button><button class="btn" id="closeDet">好的</button></div>`);
  animCanvas($('detCv'),sp);
  $('closeDet').onclick=closeModal;
  $('readBtn').onclick=()=>say(sp.name+'。'+sp.facts.join('。'),true);
}

/* =================== 问答 =================== */
const QZ={};
const lenNum=sp=>parseFloat((sp.len.match(/[\d.]+/)||[0])[0]);
function pickOthers(pred,n,exclude){return shuffle(SPECIES.filter(s=>!exclude.includes(s.id)&&pred(s))).slice(0,n);}
function makeQ(){
  const pool=SPECIES.filter(s=>has(s.id)); const tgt=pool[Math.floor(Math.random()*pool.length)];
  const types=['which','period','diet','fact','fact','long'];
  for(let tries=0;tries<20;tries++){
    const ty=types[Math.floor(Math.random()*types.length)];
    if(ty==='which'){const o=pickOthers(()=>true,2,[tgt.id]); return {q:`哪一只是 <b>${tgt.name}</b>？`, opts:shuffle([tgt,...o]), ans:tgt.id, hideNames:true, ex:`这是${tgt.name}。${tgt.facts[0]}`};}
    if(ty==='period'){const o=pickOthers(s=>s.period!==tgt.period,2,[tgt.id]); if(o.length<2) continue; return {q:`哪只生活在 <b>${PERIODS[tgt.period].name}</b>？`, opts:shuffle([tgt,...o]), ans:tgt.id, ex:`${tgt.name}生活在${PERIODS[tgt.period].name}（${PERIODS[tgt.period].time}）。`};}
    if(ty==='diet'){const d=tgt.diet[0]; const o=pickOthers(s=>!s.diet.includes(d),2,[tgt.id]); if(o.length<2) continue; const w={plant:'吃植物',meat:'吃肉',fish:'吃鱼'}[d]; return {q:`下面哪只恐龙<b>${w}</b>？`, opts:shuffle([tgt,...o]), ans:tgt.id, ex:`${tgt.name}是${tgt.dietTxt}的。`};}
    if(ty==='fact'){const f=tgt.facts[Math.floor(Math.random()*tgt.facts.length)].split(tgt.name).join('它'); const o=pickOthers(()=>true,2,[tgt.id]); return {q:`“${f}”<br>说的是哪一只？`, opts:shuffle([tgt,...o]), ans:tgt.id, ex:`答案是${tgt.name}。`};}
    if(ty==='long'){if(tgt.gait==='fly') continue; const o=pickOthers(s=>s.gait!=='fly'&&lenNum(s)!==lenNum(tgt),2,[tgt.id]); if(o.length<2||lenNum(o[0])===lenNum(o[1])) continue; const opts=shuffle([tgt,...o]); const best=opts.reduce((a,b)=>lenNum(a)>lenNum(b)?a:b);
      return {q:'这三只里，哪一只<b>身体最长</b>？', opts, ans:best.id, ex:opts.map(s=>`${s.name}${s.len}`).join('，')+'。'};}
  }
  const o=pickOthers(()=>true,2,[tgt.id]); return {q:`哪一只是 <b>${tgt.name}</b>？`, opts:shuffle([tgt,...o]), ans:tgt.id, hideNames:true, ex:`这是${tgt.name}。`};
}
function quizStart(){
  const n=ST.found.length;
  if(n<3){$('quizBody').innerHTML=`<p class="sub">先发现至少 3 种恐龙，才能开始问答哦（现在 ${n} 种）。<br>去考察地挖化石吧！</p><button class="btn" data-tab="sites">去考察 ⛏️</button>`; return;}
  Object.assign(QZ,{i:0,total:5,right:0});
  $('quizBody').innerHTML=`<p class="sub">一共 5 题，题目来自你已经发现的恐龙。答对一题得 2 个研究点，答错也没关系，会告诉你答案。</p><div class="row"><button class="btn" id="qGo">开始 ▶</button></div>`;
  $('qGo').onclick=quizNext;
}
function quizNext(){
  if(QZ.i>=QZ.total){$('quizBody').innerHTML=`<div style="text-align:center"><div style="font-size:60px">🏅</div><h2>答完啦！</h2><p class="sub">这一轮答对 ${QZ.right} / ${QZ.total} 题，得到 ${QZ.right*2} 个研究点。</p><button class="btn" id="qAgain">再来一轮</button></div>`; $('qAgain').onclick=()=>{Object.assign(QZ,{i:0,right:0}); quizNext();}; return;}
  const Q=makeQ(); QZ.cur=Q; QZ.answered=false;
  $('quizBody').innerHTML=`<div class="dots">${[...Array(QZ.total)].map((_,k)=>`<i class="${k<QZ.i?'on':''}"></i>`).join('')}</div><div id="qText">${Q.q}</div><div class="opts" id="opts"></div><div id="qFeedback"></div><div class="row"><button class="btn" id="qNext" style="visibility:hidden">下一题 ➜</button></div>`;
  Q.opts.forEach(sp=>{const b=document.createElement('button'); b.className='opt'; b.appendChild(miniCanvas(sp,'live',220,130)); const nm=document.createElement('b'); nm.textContent=Q.hideNames?'':sp.name; b.appendChild(nm);
    b.onclick=()=>{if(QZ.answered) return; QZ.answered=true; const ok=sp.id===Q.ans;
      document.querySelectorAll('.opt').forEach((o,k)=>{const s=Q.opts[k]; if(s.id===Q.ans) o.classList.add('right'); else o.classList.add('dim'); if(Q.hideNames) o.querySelector('b').textContent=s.name;});
      if(ok){QZ.right++; addPts(2); sHappy(); $('qFeedback').innerHTML=`✅ 答对了！${Q.ex}`;} else {sSoft(); $('qFeedback').innerHTML=`💡 正确答案是绿色框里的那只。${Q.ex}`;}
      QZ.i++; $('qNext').style.visibility='visible';};
    $('opts').appendChild(b);});
  $('qNext').onclick=quizNext;
}
