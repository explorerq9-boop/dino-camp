      if(!pal.sil){ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.2; const m=P(f,0,b+z*0.15), tp=P(f,z*0.02,b+z*0.85); line(ctx,m,tp);}
    }
  }
  if(feat.t==='sail'){
    const top=[], bot=[];
    for(let s=feat.s0;s<=feat.s1+1e-6;s+=0.1){const f=F(S,s), q=(s-feat.s0)/(feat.s1-feat.s0), h=feat.h*Math.pow(Math.sin(Math.PI*q),0.75);
      top.push(P(f,0,f.wt*0.6+h)); bot.push(P(f,0,f.wt*0.5));}
    ctx.beginPath(); smoothTo(ctx,top,true); smoothTo(ctx,bot.reverse(),false); ctx.closePath();
    const col=pal.fossil?'#e3d2ae':pal.accent;
    if(!pal.sil){const yb=Math.min(...top.map(p=>p.y)); const g=ctx.createLinearGradient(0,yb,0,bot[0].y); g.addColorStop(0,shade(col.startsWith('#')?col:'#e3d2ae',1.15)); g.addColorStop(1,col.startsWith('#')?shade(col,0.85):col); ctx.fillStyle=g;} else ctx.fillStyle=pal.accent;
    ctx.fill(); ctx.strokeStyle=pal.line; ctx.lineWidth=1.6; ctx.stroke();
    if(!pal.sil){ctx.save(); ctx.clip(); ctx.strokeStyle='rgba(60,30,20,.22)'; ctx.lineWidth=1.4;
      for(let s=feat.s0+0.15;s<feat.s1;s+=0.22){const f=F(S,s); line(ctx,P(f,0,f.wt*0.5),P(f,0,f.wt+feat.h*1.1));}
      ctx.restore();}
  }
  if(feat.t==='crest'){
    const f=F(S,feat.i), pts=feat.pts.map(([u,v])=>P(f,u,v));
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(const pass of [0,1]){ctx.strokeStyle=pass?(pal.fossil?'#e5d4b0':pal.accent):pal.line; ctx.lineWidth=feat.w+(pass?0:3.4);
      ctx.beginPath(); smoothTo(ctx,pts,true); ctx.stroke();}
    if(!pal.sil){ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.5; ctx.beginPath(); smoothTo(ctx,pts.map(p=>({x:p.x,y:p.y-feat.w*0.22})),true); ctx.stroke();}
  }
  if(feat.t==='spikes'){
    for(const [s,vf,ang,len] of feat.list){const f=F(S,s); hornShape(ctx,f,0,f.wt*vf,len,ang,3.2,pal.horn,pal.line);}
  }
  if(feat.t==='tailfan' && !pal.sil){
    const f=F(S,0.3); ctx.strokeStyle=pal.dark; ctx.lineCap='round';
    for(let k=-3;k<=3;k++){ctx.lineWidth=2.4; const a=Math.PI+k*0.16; const b=P(f,0,0);
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.quadraticCurveTo(b.x+Math.cos(a)*feat.len*0.6,b.y+Math.sin(a)*feat.len*0.6+2,b.x+Math.cos(a)*feat.len,b.y+Math.sin(a)*feat.len); ctx.stroke();}
  }
  if(feat.t==='club'){
    const f=F(S,0.05), c=P(f,-4,0);
    ctx.fillStyle=pal.sil?pal.base:(pal.fossil?'#e0cfa9':shade(sp.color,0.8)); ctx.strokeStyle=pal.line; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.ellipse(c.x,c.y-3,10,7,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(c.x+1,c.y+4,11,7.5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
}
function featFront(ctx,S,sp,pal,feat){ // 画在身体前面的
  if(feat.t==='frill'){
    const f=F(S,feat.i), c=P(f,feat.u,feat.v), rot=Math.atan2(f.ty,f.tx)+feat.rot;
    const col=pal.fossil?'#e3d1aa':pal.accent;
    ctx.fillStyle=pal.sil?pal.accent:(pal.fossil?'#efe1c2':shade(col,0.9)); ctx.strokeStyle=pal.line; ctx.lineWidth=1.4;
    for(let k=0;k<13;k++){const a=-Math.PI*0.95+k*(Math.PI*1.25/12); const x=c.x+Math.cos(a)*feat.rx*Math.cos(rot)-Math.sin(a)*feat.ry*Math.sin(rot), y=c.y+Math.cos(a)*feat.rx*Math.sin(rot)+Math.sin(a)*feat.ry*Math.cos(rot);
      ctx.beginPath(); ctx.arc(x,y,4.2,0,Math.PI*2); ctx.fill(); ctx.stroke();}
    ctx.beginPath(); ctx.ellipse(c.x,c.y,feat.rx,feat.ry,rot,0,Math.PI*2);
    if(!pal.sil){const g=ctx.createRadialGradient(c.x+8,c.y+8,2,c.x,c.y,feat.ry); g.addColorStop(0,shade(pal.fossil?'#e3d1aa':col,0.75)); g.addColorStop(0.6,col); g.addColorStop(1,shade(pal.fossil?'#e3d1aa':col,1.15)); ctx.fillStyle=g;} else ctx.fillStyle=pal.accent;
    ctx.fill(); ctx.lineWidth=1.8; ctx.stroke();
    if(!pal.sil && !pal.fossil){ctx.strokeStyle=rgba(sp.color,0.45); ctx.lineWidth=2;
      for(let k=0;k<6;k++){const a=-Math.PI*0.85+k*0.22; ctx.beginPath(); ctx.moveTo(c.x+Math.cos(a+rot)*5,c.y+Math.sin(a+rot)*5); ctx.lineTo(c.x+Math.cos(a+rot)*feat.ry*0.82,c.y+Math.sin(a+rot)*feat.ry*0.82); ctx.stroke();}}
  }
  if(feat.t==='headball'){
    const f=F(S,feat.i), c=P(f,feat.u,feat.v), rot=Math.atan2(f.ty,f.tx)+feat.rot;
    ctx.beginPath(); ctx.ellipse(c.x,c.y,feat.rx,feat.ry,rot,0,Math.PI*2);
    if(!pal.sil){const g=ctx.createLinearGradient(0,c.y-feat.ry,0,c.y+feat.ry); g.addColorStop(0,pal.dark); g.addColorStop(0.5,pal.base); g.addColorStop(1,pal.belly); ctx.fillStyle=g;} else ctx.fillStyle=pal.base;
    ctx.fill(); ctx.strokeStyle=pal.line; ctx.lineWidth=2; ctx.stroke();
  }
  if(feat.t==='horn'){const f=F(S,feat.i); hornShape(ctx,f,feat.u,feat.v,feat.len,feat.ang,feat.w,pal.horn,pal.line);}
  if(feat.t==='bump'){const f=F(S,feat.i), c=P(f,feat.u,feat.v); ctx.beginPath(); ctx.arc(c.x,c.y,feat.r,Math.PI,0); ctx.fillStyle=pal.base; ctx.fill(); ctx.strokeStyle=pal.line; ctx.lineWidth=1.6; ctx.stroke();}
  if(feat.t==='armor'){
    let row=0;
    for(let s=feat.s0;s<=feat.s1;s+=feat.step){const f=F(S,s); row++;
      for(const [vf,rf] of [[0.78,0.16],[0.42,0.14],[0.08,0.12]]){
        const c=P(f,(row%2)*2,f.wt*vf), r=Math.max(2.4,f.wt*rf);
        ctx.beginPath(); ctx.ellipse(c.x,c.y,r*1.1,r*0.8,0,0,Math.PI*2);
        ctx.fillStyle=pal.sil?pal.dark:(pal.fossil?'#ddc9a0':shade(sp.color,0.78)); ctx.fill();
        if(!pal.sil){ctx.strokeStyle=pal.line; ctx.lineWidth=1; ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(c.x-r*0.3,c.y-r*0.3,r*0.3,0,Math.PI*2); ctx.fill();}
      }}
  }
  if(feat.t==='fuzz' && !pal.sil){
    ctx.strokeStyle=pal.fossil?'rgba(140,115,80,.4)':rgba(sp.color,0.9); ctx.lineWidth=1.6; ctx.lineCap='round';
    for(let s=feat.s0;s<=feat.s1;s+=0.17){const f=F(S,s), b=P(f,0,f.wt-1.5), e=P(f,-feat.len*1.1,f.wt+feat.len*0.45);
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.quadraticCurveTo((b.x+e.x)/2,(b.y+e.y)/2-1.5,e.x,e.y); ctx.stroke();}
  }
}
function pattern(ctx,S,sp,pal){
  for(const feat of sp.feats||[]){
    if(feat.t==='stripes'){ctx.fillStyle=rgba(sp.accent.startsWith('#')?sp.accent:'#000000',0.32);
      if(sp.id==='tri'||sp.id==='para'||sp.id==='spino'||sp.id==='guan') ctx.fillStyle='rgba(40,30,20,.18)';
      for(let k=0;k<feat.n;k++){const s=feat.s0+(feat.s1-feat.s0)*k/(feat.n-1), f=F(S,s), d=(f.wt+f.wb)*feat.depth;
        const a=P(f,-feat.w,f.wt+2), b=P(f,feat.w*1.2,f.wt+2), c=P(f,feat.w*0.2,f.wt-d), e=P(f,-feat.w*0.6,f.wt-d*0.85);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.quadraticCurveTo(c.x+2,c.y,c.x,c.y); ctx.lineTo(e.x,e.y); ctx.closePath(); ctx.fill();}}
    if(feat.t==='rings'){ctx.fillStyle='rgba(255,246,230,.85)';
      for(let k=0;k<feat.n;k++){const s=feat.s0+(feat.s1-feat.s0)*k/(feat.n-1), f=F(S,s), w=1.6+k*0.15;
        const a=P(f,-w,f.wt+2), b=P(f,w,f.wt+2), c=P(f,w,-f.wb-2), d=P(f,-w,-f.wb-2);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();}}
  }
}

/* ============ 主绘制 ============ */
function drawDino(ctx,sp,o={}){
  const mode=o.mode||'live', pal=Object.assign({},palette(sp,mode),{rich:!!o.rich}), t=o.t||0, ph=o.phase||0, mv=!!o.moving;
  const S=sample(pose(sp,o));
  const feats=sp.feats||[];
  const gaitOff = sp.gait==='quad'? [[0,Math.PI],[Math.PI,0]] : [[0,Math.PI]];
  ctx.save(); ctx.lineJoin='round';
  // 远侧肢体
  const legs=(sp.legs||[]).map((L,j)=>({L, near:legGeom(S,L,ph+gaitOff[j]?.[0]||0,mv,false), far:legGeom(S,L,ph+(gaitOff[j]?.[1]??Math.PI),mv,true)}));
  if(sp.gait==='fly') wing(ctx,S,sp,pal,t,true);
  legs.forEach(g=>drawLeg(ctx,g.far,g.L,pal.limbFar,pal.line,pal));
  (sp.arms||[]).forEach(A=>{const g=armGeom(S,A,t+1); g.s.x-=3; g.e.x-=3; g.h.x-=3; drawArm(ctx,g,A,pal.limbFar,pal.line,pal);});
  feats.forEach(f=>featBack(ctx,S,sp,pal,f));
  // 身体
  bodyPath(ctx,S);
  let minY=1e9,maxY=-1e9; S.forEach(p=>{minY=Math.min(minY,p.y-p.wt); maxY=Math.max(maxY,p.y+p.wb);});
  if(pal.sil) ctx.fillStyle=pal.base; else {const g=ctx.createLinearGradient(0,minY,0,maxY); g.addColorStop(0,pal.dark); g.addColorStop(0.45,pal.base); g.addColorStop(0.8,pal.belly); g.addColorStop(1,pal.belly); ctx.fillStyle=g;}
  ctx.fill();
  if(!pal.sil){
    ctx.save(); bodyPath(ctx,S); ctx.clip();
    if(!pal.fossil) pattern(ctx,S,sp,pal);
    // 体积感：内阴影 + 背部高光
    bodyPath(ctx,S); ctx.strokeStyle='rgba(50,35,20,.16)'; ctx.lineWidth=9; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath();
    smoothTo(ctx,S.slice(Math.floor(PER*0.6),Math.floor((sp.neck+1)*PER)).map(p=>({x:p.x+p.nx*(p.wt*0.7),y:p.y+p.ny*(p.wt*0.7)})),true); ctx.stroke();
    if(pal.fossil) fossilMarks(ctx,S,sp);
    if(o.rich){ // 立体光影：顶光高光 + 腹部环境遮蔽 + 边缘反光
      const hp=F(S,sp.hipIdx+0.6), c=P(hp,0,hp.wt*0.6), R=(maxY-minY)*1.6;
      let gr=ctx.createRadialGradient(c.x-8,c.y-6,2,c.x,c.y,R); gr.addColorStop(0,'rgba(255,250,230,.42)'); gr.addColorStop(0.35,'rgba(255,250,230,.12)'); gr.addColorStop(1,'rgba(255,250,230,0)');
      ctx.fillStyle=gr; ctx.fillRect(-400,-400,900,800);
      gr=ctx.createLinearGradient(0,minY,0,maxY); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(0.62,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(30,20,10,.32)');
      ctx.fillStyle=gr; ctx.fillRect(-400,-400,900,800);
      const hd=F(S,sp.spine.length-2.2), hc=P(hd,0,hd.wt*0.5);
      gr=ctx.createRadialGradient(hc.x,hc.y,1,hc.x,hc.y,hd.wt*2.2); gr.addColorStop(0,'rgba(255,250,230,.35)'); gr.addColorStop(1,'rgba(255,250,230,0)'); ctx.fillStyle=gr; ctx.fillRect(-400,-400,900,800);
      bodyPath(ctx,S); ctx.save(); ctx.translate(0,3); ctx.strokeStyle='rgba(255,236,200,.35)'; ctx.lineWidth=3; ctx.restore();
    }
    ctx.restore();
  }
  bodyPath(ctx,S); ctx.strokeStyle=pal.line; ctx.lineWidth=pal.sil?1.5:2.2; ctx.stroke();
  feats.forEach(f=>featFront(ctx,S,sp,pal,f));
  // 近侧肢体
  legs.forEach(g=>drawLeg(ctx,g.near,g.L,pal.limb,pal.line,pal));
  (sp.arms||[]).forEach(A=>drawArm(ctx,armGeom(S,A,t),A,pal.limb,pal.line,pal));
  if(sp.gait==='fly') wing(ctx,S,sp,pal,t,false);
  // 脸
  if(!pal.sil) face(ctx,S,sp,pal,t);
  ctx.restore();
}
function fossilMarks(ctx,S,sp){
  ctx.fillStyle='rgba(140,115,80,.45)';
  const end=Math.floor((sp.neck+0.8)*PER);
  for(let j=2;j<end;j+=3){const p=S[j], r=Math.max(1.2,Math.min(2.6,(p.wt+p.wb)*0.07)); ctx.beginPath(); ctx.ellipse(p.x,p.y-p.wt*0.25,r*1.3,r,Math.atan2(p.ty,p.tx),0,Math.PI*2); ctx.fill();}
  ctx.strokeStyle='rgba(140,115,80,.4)'; ctx.lineWidth=1.6; ctx.lineCap='round';
  for(let s=sp.hipIdx-0.4;s<sp.neck-0.3;s+=0.28){const f=F(S,s), a=P(f,0,-f.wt*0.25), c=P(f,4,-f.wb*0.6), b=P(f,-1,-f.wb*0.85);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(c.x,c.y,b.x,b.y); ctx.stroke();}
}
function face(ctx,S,sp,pal,t){
  if(sp.mouth){const [i0,v0,i1,v1]=sp.mouth, f0=F(S,i0), f1=F(S,i1), a=P(f0,0,v0), b=P(f1,0,v1), m=P(F(S,(i0+i1)/2),0,(v0+v1)/2-1.2);
    ctx.strokeStyle=pal.line; ctx.lineWidth=1.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.quadraticCurveTo(m.x,m.y,a.x,a.y);
    const up=P(f0,-2.5,v0+2.2); ctx.quadraticCurveTo(a.x-1,a.y,up.x,up.y); ctx.stroke();}
  if(sp.nostril){const f=F(S,sp.nostril[0]), n=P(f,0,sp.nostril[1]); ctx.fillStyle=pal.line; ctx.beginPath(); ctx.ellipse(n.x,n.y,1.5,1,Math.atan2(f.ty,f.tx),0,Math.PI*2); ctx.fill();}
  const [ei,eu,ev,r]=sp.eye, f=F(S,ei), c=P(f,eu,ev);
  if(pal.fossil){ctx.fillStyle='rgba(120,95,60,.55)'; ctx.beginPath(); ctx.ellipse(c.x,c.y,r*1.25,r*1.05,0,0,Math.PI*2); ctx.fill(); return;}
  const blink = (Math.sin(t*0.9+sp.id.length)>0.985);
  if(blink){ctx.strokeStyle=pal.line; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(c.x,c.y-r*0.2,r,0.2,Math.PI-0.2); ctx.stroke(); return;}
  ctx.fillStyle='#fffdf5'; ctx.beginPath(); ctx.ellipse(c.x,c.y,r*1.12,r,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=pal.line; ctx.lineWidth=1.1; ctx.stroke();
  ctx.fillStyle=pal.eye||'#d6a03c'; ctx.beginPath(); ctx.arc(c.x+r*0.22,c.y+r*0.05,r*0.74,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#231d16'; ctx.beginPath(); ctx.arc(c.x+r*0.3,c.y+r*0.05,r*0.42,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(c.x+r*0.5,c.y-r*0.28,r*0.22,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=pal.line; ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(c.x,c.y+r*0.3,r*1.35,-Math.PI*0.82,-Math.PI*0.3); ctx.stroke();
}
function wing(ctx,S,sp,pal,t,far){
  const W=sp.wing, f=F(S,W.i), sh=P(f,2,1), hip=P(F(S,W.hip),0,-2), up=Math.sin(t*2.2)*(far?0.9:1);
  const span=W.span*(far?0.85:1), o=far?-4:0;
  const wrist={x:sh.x+10+o, y:sh.y-span*0.42*up-8+(far?-6:0)};
  const tip={x:sh.x-span*0.95+o, y:sh.y-span*0.32*up+2+(far?-8:0)};
  const mid={x:(tip.x+hip.x)/2+4, y:Math.max(tip.y,hip.y)+14};
  ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.quadraticCurveTo((sh.x+wrist.x)/2,wrist.y+4,wrist.x,wrist.y);
  ctx.quadraticCurveTo((wrist.x+tip.x)/2,(wrist.y+tip.y)/2-10*up-4,tip.x,tip.y);
  ctx.quadraticCurveTo(mid.x,mid.y,hip.x,hip.y); ctx.closePath();
  const col=pal.wing.startsWith('#')?pal.wing:'#d9c7a4';
  if(!pal.sil){const g=ctx.createLinearGradient(sh.x,sh.y,tip.x,tip.y); g.addColorStop(0,far?shade(col,0.72):shade(col,0.92)); g.addColorStop(1,far?shade(col,0.82):shade(col,1.12)); ctx.fillStyle=g;} else ctx.fillStyle=pal.accent;
  ctx.fill(); ctx.strokeStyle=pal.line; ctx.lineWidth=1.8; ctx.stroke();
  if(!pal.sil){ctx.strokeStyle=pal.line; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.quadraticCurveTo((sh.x+wrist.x)/2,wrist.y+4,wrist.x,wrist.y);
    ctx.quadraticCurveTo((wrist.x+tip.x)/2,(wrist.y+tip.y)/2-10*up-4,tip.x,tip.y); ctx.stroke();
    ctx.strokeStyle='rgba(80,50,30,.15)'; ctx.lineWidth=1.2; for(let k=1;k<4;k++){const q=k/4; line(ctx,{x:wrist.x+(tip.x-wrist.x)*q,y:wrist.y+(tip.y-wrist.y)*q-3},{x:hip.x+(mid.x-hip.x)*q*1.4,y:hip.y+(mid.y-hip.y)*q*1.4});}}
}

/* ============ 包围盒与适配绘制 ============ */
const BBOX={};
function bbox(sp){
  if(BBOX[sp.id]) return BBOX[sp.id];
  const c=document.createElement('canvas'); c.width=700; c.height=520; const x=c.getContext('2d');
  x.translate(220,400);
  const ts = sp.gait==='fly'? [0,0.7,1.4,2.1] : [0];
  ts.forEach(t=>drawDino(x,sp,{t:t, mode:'sil'}));
  const d=x.getImageData(0,0,700,520).data; let x0=700,y0=520,x1=0,y1=0;
  for(let yy=0;yy<520;yy+=2) for(let xx=0;xx<700;xx+=2){if(d[(yy*700+xx)*4+3]>10){if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy;}}
  return BBOX[sp.id]={x:x0-220-4,y:y0-400-4,w:x1-x0+8,h:y1-y0+8};
}
function fitDraw(ctx,sp,cw,ch,o={},pad=8){
  const b=bbox(sp), s=Math.min((cw-pad*2)/b.w,(ch-pad*2)/b.h);
  ctx.save(); ctx.translate((cw-b.w*s)/2 - b.x*s, (ch-b.h*s)/2 - b.y*s); ctx.scale(s,s);
  if(sp.gait!=='fly' && (o.mode||'live')==='live'){ctx.fillStyle='rgba(60,50,30,.13)'; ctx.beginPath(); ctx.ellipse(b.x+b.w*0.55,0,b.w*0.36,5,0,0,Math.PI*2); ctx.fill();}
  drawDino(ctx,sp,o); ctx.restore(); return s;
}

<script>
/* ================== 进化路线 ================== */
const STAGES=[
  {opts:['eorap']},
  {opts:['coelo','plateo']},
  {opts:['guan','steg']},
  {opts:['allo','tri']},
  {opts:['trex','brach']},
];
const NEED=[18,30,45,65,Infinity];          // 每个阶段需要的成长值
const STAGE_SIZE=[0.78,0.92,1.06,1.22,1.42];   // 每阶段的大小
const TRAITS={

  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.03); g.gain.exponentialRampToValueAtTime(0.0008,t+0.5); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.55);});}catch(e){} }

const HZ=()=>H*0.40;                         // 地平线

/* --- 远景预渲染（山、雾、森林剪影） --- */
let back=null;
function buildBack(){
  const w=Math.ceil(W*1.6+400), h=Math.ceil(HZ()+H*0.14), c=document.createElement('canvas'); c.width=w*DPR; c.height=h*DPR; const x=c.getContext('2d'); x.scale(DPR,DPR);
  const R=seeded(11), hz=HZ();
  const ridge=(base,amp,step,col,fog)=>{x.beginPath(); x.moveTo(0,h); let y=base; for(let i=0;i<=w;i+=step){y=base-amp*(0.5+0.5*Math.sin(i*0.004+base))-R()*amp*0.4; x.lineTo(i,y);} x.lineTo(w,h); x.closePath();
    const g=x.createLinearGradient(0,base-amp*1.4,0,h); g.addColorStop(0,col); g.addColorStop(1,fog); x.fillStyle=g; x.fill();};
  ridge(hz-H*0.08,H*0.16,40,'#8fa6c0','#c9d9dc');
  // 火山
  const vx=w*0.45, vy=hz-H*0.27, vb=H*0.34; let g=x.createLinearGradient(vx-vb,0,vx+vb,0); g.addColorStop(0,'#9d93a8'); g.addColorStop(0.55,'#8b7f97'); g.addColorStop(1,'#6f6580');
  x.fillStyle=g; x.beginPath(); x.moveTo(vx-vb,hz+10); x.lineTo(vx-vb*0.15,vy); x.quadraticCurveTo(vx,vy+8,vx+vb*0.15,vy); x.lineTo(vx+vb,hz+10); x.closePath(); x.fill();
  g=x.createLinearGradient(0,vy,0,hz); g.addColorStop(0,'rgba(200,215,220,0)'); g.addColorStop(1,'rgba(200,215,220,.8)'); x.fillStyle=g; x.fill();
  back={c,w,h,vx,vy};
  ridge(hz-H*0.02,H*0.08,30,'#7f9f8e','#b9cfbf');
  // 远处森林剪影（三层，越远越淡）
  [['#6f9273','#a9c3a6',hz+H*0.02,0.9],['#5d8462','#93b393',hz+H*0.06,1.1],['#4d7552','#86a983',hz+H*0.1,1.3]].forEach(([c1,c2,base,s])=>{
    for(let i=-20;i<w+40;i+=rnd(18,34)*s){const r=rnd(14,26)*s, y=base-rnd(0,10); const gg=x.createRadialGradient(i-r*0.3,y-r*0.4,2,i,y,r*1.2); gg.addColorStop(0,c2); gg.addColorStop(1,c1); x.fillStyle=gg; x.beginPath(); x.arc(i,y,r,0,Math.PI*2); x.fill();}
    x.fillStyle=c1; x.fillRect(0,base,w,h-base);});
  g=x.createLinearGradient(0,hz-H*0.05,0,h); g.addColorStop(0,'rgba(235,240,225,0)'); g.addColorStop(0.7,'rgba(235,240,225,.35)'); g.addColorStop(1,'rgba(235,240,225,.15)'); x.fillStyle=g; x.fillRect(0,0,w,h);
}

/* --- 大树（装饰，带光影） --- */
function drawTree(x,tr,k){
  const s=tr.s*k; ctx.save(); ctx.translate(x,tr.y);
  // 投影
  let g=ctx.createRadialGradient(0,0,2,0,0,90*s); g.addColorStop(0,'rgba(20,35,15,.35)'); g.addColorStop(1,'rgba(20,35,15,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(10*s,0,95*s,22*s,0,0,Math.PI*2); ctx.fill();
  if(tr.type==='conifer'){
    g=ctx.createLinearGradient(-9*s,0,9*s,0); g.addColorStop(0,'#8a6847'); g.addColorStop(0.5,'#6c4f34'); g.addColorStop(1,'#4b3523'); ctx.fillStyle=g; ctx.fillRect(-8*s,-260*s,16*s,262*s);
    for(let i=0;i<6;i++){const y=-255*s+i*30*s, r=(36+i*9)*s; blob(0,y,r*1.25,r*0.45,'#3f6b3c','#7fae66');}
  } else if(tr.type==='palm'){
    g=ctx.createLinearGradient(-12*s,0,12*s,0); g.addColorStop(0,'#a07a50'); g.addColorStop(1,'#5d4129'); ctx.strokeStyle=g; ctx.lineWidth=16*s; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(18*s,-120*s,4*s,-230*s); ctx.stroke();
    ctx.strokeStyle='rgba(60,40,20,.3)'; ctx.lineWidth=2; for(let y=-20;y>-220;y-=16){ctx.beginPath(); ctx.moveTo(-7*s+ (y<-120?10*s:6*s),y*s); ctx.lineTo(7*s+(y<-120?10*s:6*s),y*s-4*s); ctx.stroke();}
    ctx.translate(4*s,-232*s); for(let i=0;i<10;i++){const a=-Math.PI+0.1+i*(Math.PI-0.2)/9+Math.sin(G.t*0.6+i+tr.x)*0.03; leafFrond(a,110*s,i%2?'#4f8a43':'#3f7438','#86bb6a');}
  } else { // 阔叶树
    g=ctx.createLinearGradient(-12*s,0,12*s,0); g.addColorStop(0,'#8d6a45'); g.addColorStop(1,'#4e3824'); ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(-14*s,0); ctx.lineTo(-7*s,-150*s); ctx.lineTo(7*s,-150*s); ctx.lineTo(14*s,0); ctx.closePath(); ctx.fill();
    const R=seeded(Math.floor(tr.x));
    for(let i=0;i<12;i++){const a=R()*Math.PI*2, r=R()*70*s; blob(Math.cos(a)*r*1.2, -190*s+Math.sin(a)*r*0.7, (34+R()*22)*s, (30+R()*18)*s, '#3e6d39','#8cc070');}
  }
  ctx.restore();
}
function blob(x,y,rx,ry,dark,light){const g=ctx.createRadialGradient(x-rx*0.35,y-ry*0.45,1,x,y,Math.max(rx,ry)*1.1); g.addColorStop(0,light); g.addColorStop(0.55,shade(dark,1.25)); g.addColorStop(1,dark); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill();}
function leafFrond(a,len,col,hl){const ex=Math.cos(a)*len, ey=Math.sin(a)*len+len*0.35, cx=ex*0.5, cy=Math.sin(a)*len*0.5-len*0.15;
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,len*0.03); ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(cx,cy,ex,ey); ctx.stroke();
  for(let k=1;k<14;k++){const t=k/14, px=2*(1-t)*t*cx+t*t*ex, py=2*(1-t)*t*cy+t*t*ey, l=len*0.2*(1-t*0.6);
    ctx.strokeStyle=k%3?col:hl; ctx.lineWidth=Math.max(1.2,len*0.025); ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+l*0.5,py+l*0.9); ctx.moveTo(px,py); ctx.lineTo(px-l*0.5,py+l*0.9); ctx.stroke();}}

function sphere(x,y,r,col,spec=true){const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r); g.addColorStop(0,shade(col,1.55)); g.addColorStop(0.5,col); g.addColorStop(1,shade(col,0.55)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  if(spec){ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(x-r*0.35,y-r*0.42,r*0.22,r*0.14,-0.6,0,Math.PI*2); ctx.fill();}}
function drawFood(it,x,y,k){
  const t=G.t, s=k; ctx.save(); ctx.translate(x,y);
  if(!FOOD[it.type].air){const g=ctx.createRadialGradient(0,0,1,0,0,26*s*it.sz); g.addColorStop(0,'rgba(20,35,15,.35)'); g.addColorStop(1,'rgba(20,35,15,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,1,26*s*it.sz,8*s*it.sz,0,0,Math.PI*2); ctx.fill();}
  ctx.scale(s*it.sz,s*it.sz);
  switch(it.type){
    case 'berry': ctx.strokeStyle='#5a7a3a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(-4,-10); ctx.moveTo(0,-26); ctx.lineTo(6,-12); ctx.stroke();
      [[-6,-6,7],[6,-7,7],[0,-14,7],[1,-2,6]].forEach(([a,b,r])=>sphere(a,b,r,'#d6455a')); blob(4,-27,7,4,'#4f8a3c','#9fd27a'); break;
    case 'beetle': { const w=Math.sin(t*8+it.x)*1.5; ctx.translate(w,0); ctx.strokeStyle='#2c2a26'; ctx.lineWidth=1.8; for(let i=-1;i<=1;i++){ctx.beginPath(); ctx.moveTo(i*6,-6); ctx.lineTo(i*9-3,0); ctx.stroke();}
      const g=ctx.createLinearGradient(-12,-20,12,0); g.addColorStop(0,'#5fd0b6'); g.addColorStop(0.5,'#2f8f86'); g.addColorStop(1,'#1d4f6a'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,-9,13,9,0,Math.PI,0); ctx.ellipse(0,-9,13,3,0,0,Math.PI); ctx.fill();
      ctx.fillStyle='#22302e'; ctx.beginPath(); ctx.arc(13,-8,4.5,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(-2,-10,8,-2.6,-1.7); ctx.stroke(); ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(2,-18); ctx.lineTo(2,-6); ctx.stroke(); break; }
    case 'fly': case 'drag': { const big=it.type==='drag'?1.6:1; ctx.scale(big,big); ctx.translate(0,-30+Math.sin(t*2+it.x)*6); const fl=Math.sin(t*30+it.x)*0.4;
      ctx.fillStyle='rgba(210,235,255,.55)'; ctx.strokeStyle='rgba(120,160,190,.7)'; ctx.lineWidth=0.8;
      [[-1,1],[1,1]].forEach(([a])=>{ctx.save(); ctx.rotate(a*0.15+fl); ctx.beginPath(); ctx.ellipse(-2,-10,5,15,0.3,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(4,-9,4,13,-0.3,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();});
      const g=ctx.createLinearGradient(-20,0,10,0); g.addColorStop(0,'#2f6fb2'); g.addColorStop(1,'#56b6d8'); ctx.strokeStyle=g; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-22,2); ctx.lineTo(6,0); ctx.stroke(); sphere(9,-1,4.5,'#3b8fc4'); break; }
    case 'fern': for(let i=0;i<7;i++){const a=-Math.PI+0.35+i*(Math.PI-0.7)/6+Math.sin(t+it.x)*0.04; leafFrond(a,34,i%2?'#4c8a3d':'#3f7836','#9ccf72');} break;
    case 'mush': { const g=ctx.createLinearGradient(-5,0,5,0); g.addColorStop(0,'#fff8ea'); g.addColorStop(1,'#d8ccb4'); ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(-5,-20,10,20,4); ctx.fill();
      const c=ctx.createRadialGradient(-6,-30,2,0,-22,20); c.addColorStop(0,'#ffb07a'); c.addColorStop(0.6,'#e0663f'); c.addColorStop(1,'#a8402a'); ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,-20,17,13,0,Math.PI,0); ctx.quadraticCurveTo(0,-15,-17,-20); ctx.fill();
      ctx.fillStyle='rgba(255,250,235,.9)'; [[-7,-26,2.6],[4,-29,2.2],[9,-22,2],[-1,-22,1.8]].forEach(([a,b,r])=>{ctx.beginPath(); ctx.arc(a,b,r,0,Math.PI*2); ctx.fill();}); break; }
    case 'cone': for(let i=0;i<6;i++){const a=-Math.PI+0.4+i*(Math.PI-0.8)/5; leafFrond(a,40,'#3f7836','#8cc46a');}
      { const g=ctx.createRadialGradient(-6,-26,2,0,-18,22); g.addColorStop(0,'#ffd98a'); g.addColorStop(0.6,'#d99a3a'); g.addColorStop(1,'#8d5a22'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,-17,12,18,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(110,60,20,.45)'; ctx.lineWidth=1.2; for(let k=-2;k<=2;k++){ctx.beginPath(); ctx.moveTo(-12,-17+k*6); ctx.lineTo(0,-23+k*6); ctx.lineTo(12,-17+k*6); ctx.stroke();} } break;
    case 'milli': { const segs=10; for(let i=segs-1;i>=0;i--){const xx=-i*6+Math.sin(t*3)*1, yy=-6-Math.sin(i*0.6+t*4)*2; ctx.strokeStyle='#3a2a1c'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx-2+Math.sin(t*12+i)*2,0); ctx.stroke(); sphere(xx,yy,5.5,i%2?'#9a5a2e':'#b46a34',i===0);} ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(3,-8,1.3,0,Math.PI*2); ctx.fill(); break; }
    case 'melon': blob(-12,-6,16,7,'#3f7836','#8cc46a'); sphere(0,-18,17,'#d9b23a'); ctx.strokeStyle='rgba(120,90,20,.35)'; ctx.lineWidth=1.5; for(let k=-1;k<=1;k++){ctx.beginPath(); ctx.ellipse(k*6,-18,4,16,0,0,Math.PI*2); ctx.stroke();} break;
    case 'roach': { const w=Math.sin(t*6+it.x); ctx.strokeStyle='#2a1d12'; ctx.lineWidth=2; for(let i=-1;i<=1;i++){ctx.beginPath(); ctx.moveTo(i*9,-7); ctx.lineTo(i*13-4+w*2,0); ctx.stroke();}
      const g=ctx.createLinearGradient(0,-24,0,-2); g.addColorStop(0,'#c98a4a'); g.addColorStop(1,'#6b3e1c'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,-11,22,11,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,230,190,.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(-2,-15,13,4,0,Math.PI,0); ctx.stroke();
      ctx.strokeStyle='rgba(60,30,10,.5)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(0,-2); ctx.stroke(); ctx.strokeStyle='#2a1d12'; ctx.beginPath(); ctx.moveTo(20,-12); ctx.quadraticCurveTo(34,-26,40,-20); ctx.stroke(); break; }
    case 'tree': { const g=ctx.createLinearGradient(-6,0,6,0); g.addColorStop(0,'#8d6a45'); g.addColorStop(1,'#4e3824'); ctx.fillStyle=g; ctx.fillRect(-5,-60,10,60);
      const R=seeded(Math.floor(it.x)); for(let i=0;i<9;i++){blob((R()-0.5)*44,-74+(R()-0.5)*30,14+R()*8,12+R()*6,'#c79a2a','#ffe27a');} break; }
  }
  ctx.restore();
  if(it.lock && it.lockA>0.01){ctx.globalAlpha=it.lockA; ctx.font=`${Math.round(20*k)}px sans-serif`; ctx.textAlign='center'; ctx.fillText('🔒',x,y-48*k*it.sz); ctx.globalAlpha=1;}
}

  G.trees=[]; for(let x=0;x<G.W;x+=rnd(160,320)){G.trees.push({x, d:Math.random()<0.5?rnd(-0.05,0.12):rnd(0.92,1.05), type:['palm','broad','conifer','palm'][Math.floor(Math.random()*4)], s:rnd(0.75,1.05)});}
  G.tufts=[]; for(let i=0;i<G.W/9;i++) G.tufts.push({x:Math.random()*G.W, d:Math.random(), c:Math.random()});
  G.flowers=[]; for(let i=0;i<G.W/45;i++) G.flowers.push({x:Math.random()*G.W, d:Math.random(), c:['#f6d36b','#f3a6b7','#ffffff','#c7a6e8'][Math.floor(Math.random()*4)]});
  G.rocks=[]; for(let i=0;i<G.W/300;i++) G.rocks.push({x:Math.random()*G.W, d:Math.random(), r:rnd(10,22)});
  G.items=[]; for(let i=0;i<G.W/55;i++) spawnItem();
  G.npcs=[]; ['sino','raptor','anky','para','spino','mamen','tri','steg'].forEach(id=>G.npcs.push({sp:SP[id], x:rnd(300,G.W-300), d:Math.random(), dir:Math.random()<0.5?1:-1, phase:Math.random()*6, tx:0, st:'walk', timer:0, t0:Math.random()*20}));
  G.npcs.forEach(n=>n.tx=n.x+rnd(-400,400));
  G.ptero={x:rnd(0,G.W), y:0.18, dir:1, t0:3};
  G.motes=[]; for(let i=0;i<40;i++) G.motes.push({x:Math.random(), y:Math.random(), s:rnd(1,2.5), v:rnd(0.005,0.02)});
}
function spawnItem(near){
  // 让食物的种类跟着玩家阶段走：总有能吃的，也能看到更大的目标
  const st=SV.stage+1, w=FOOD_KEYS.map(k=>{const tr=FOOD[k].tier; return tr<=st? (tr===st?3:tr===st-1?2:0.6) : (tr===st+1?1:0.25);});
  let r=Math.random()*w.reduce((a,b)=>a+b), k=0; while(r>w[k]){r-=w[k]; k++;}
  let x=near? PL.x+(Math.random()<0.5?-1:1)*rnd(W*0.6,W*1.2) : rnd(80,G.W-80); x=Math.max(60,Math.min(G.W-60,x));
  G.items.push({type:FOOD_KEYS[k], x, d:rnd(0.05,0.97), sz:rnd(0.85,1.1), lockA:0, bob:Math.random()*6});
}

const curSp=()=>SP[SV.path[SV.stage]];
function pScale(){return U()*STAGE_SIZE[SV.stage]*(0.82+0.18*Math.min(1,SV.xp/NEED[SV.stage]))*(1+PL.grow*0.06)*gs(PL.d);}
function mouth(){const sp=curSp(), b=bbox(sp), k=pScale(); const mx=PL.x+PL.dir*(b.x+b.w-6)*k; return {x:mx, y:gy(PL.d)+(b.y+b.h*0.25)*k};}
let input={on:false,sx:0,sy:0,x:0,y:0}, keys={};
cv.addEventListener('pointerdown',e=>{if(G.paused) return; input={on:true,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY}; const j=$('joy'); j.style.left=e.clientX+'px'; j.style.top=e.clientY+'px'; j.style.display='block'; j.firstElementChild.style.transform=''; cv.setPointerCapture(e.pointerId); if(actx&&actx.state==='suspended') actx.resume();});
cv.addEventListener('pointermove',e=>{if(!input.on) return; input.x=e.clientX; input.y=e.clientY; let dx=input.x-input.sx, dy=input.y-input.sy; const l=Math.hypot(dx,dy), m=50; if(l>m){dx*=m/l; dy*=m/l;} $('joy').firstElementChild.style.transform=`translate(${dx}px,${dy}px)`;});
const endIn=()=>{input.on=false; $('joy').style.display='none';};
cv.addEventListener('pointerup',endIn); cv.addEventListener('pointercancel',endIn);
addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);

function updatePlayer(dt){
  let ax=0, ad=0;
  if(input.on){const dx=input.x-input.sx, dy=input.y-input.sy, l=Math.hypot(dx,dy); if(l>8){ax=dx/Math.max(l,50); ad=dy/Math.max(l,50);}}
  if(keys.ArrowLeft||keys.a) ax=-1; if(keys.ArrowRight||keys.d) ax=1; if(keys.ArrowUp||keys.w) ad=-1; if(keys.ArrowDown||keys.s) ad=1;
  const sp=curSp(), spd=(150+STAGE_SIZE[SV.stage]*90)*(sp.id==='coelo'||sp.id==='guan'?1.2:1)*(Math.min(H,W*0.85)/800);
  PL.vx+=(ax*spd-PL.vx)*Math.min(1,dt*5); PL.vd+=(ad*0.5-PL.vd)*Math.min(1,dt*5);
  PL.x+=PL.vx*dt; PL.d=Math.max(0,Math.min(1,PL.d+PL.vd*dt)); PL.x=Math.max(80,Math.min(G.W-80,PL.x));
  if(Math.abs(PL.vx)>8) PL.dir=PL.vx>0?1:-1;
  const moving=Math.hypot(PL.vx,PL.vd*400)>14; PL.moving=moving;
  const legL=(sp.legs[0].l1+sp.legs[0].l2)*pScale(); if(moving) PL.phase+=dt*Math.max(Math.abs(PL.vx),Math.abs(PL.vd)*300)/(legL*0.55);
  PL.grow=Math.max(0,PL.grow-dt*1.5); PL.munch=Math.max(0,PL.munch-dt*3); PL.bump=Math.max(0,PL.bump-dt);
  // 吃东西
  const m=mouth(), tierNow=SV.stage+1, reach=Math.max(26,40*pScale()/U()*0.6);
  for(let i=G.items.length-1;i>=0;i--){const it=G.items[i], f=FOOD[it.type];
    const near=Math.abs(it.x-m.x)<reach+20*it.sz && Math.abs(it.d-PL.d)<0.09;
    if(f.tier>tierNow){ it.lock=true; it.lockA += ((near||Math.abs(it.x-m.x)<reach*2.5&&Math.abs(it.d-PL.d)<0.15)?1:-1)*dt*2; it.lockA=Math.max(0,Math.min(1,it.lockA));
      if(near && !it.told){it.told=true; tip(`${f.name}太大了，要长大一点才能吃 🌱`);} continue; }
    it.lock=false;
    if(near){ eat(it,i); }
  }
  // 碰到比自己大的恐龙：被轻轻推开
  for(const n of G.npcs){ if(n.sp.size*0.9<=STAGE_SIZE[SV.stage]) continue; const b=bbox(n.sp), k=U()*n.sp.size*0.8*gs(n.d); const cx=n.x+n.dir*(b.x+b.w*0.5)*k;
    if(Math.abs(cx-PL.x)<b.w*k*0.35 && Math.abs(n.d-PL.d)<0.06 && PL.bump<=0){PL.bump=1.2; PL.vx=(PL.x<cx?-1:1)*260; tip(`${n.sp.name}：“小家伙，小心哦！” 😊`); tone([330,392],0.04);} }
}
function eat(it,i){
  const f=FOOD[it.type], sp=curSp(); let xp=f.xp, bonus=false;
  if((f.kind==='bug'&&meatEater(sp))||(f.kind==='plant'&&plantEater(sp))){xp=Math.round(xp*1.5+0.5); bonus=true;}
  G.items.splice(i,1); spawnItem(true);
  PL.munch=1; PL.grow=1;
  const m=mouth();
  for(let k=0;k<7;k++) G.parts.push({x:m.x,y:m.y,vx:rnd(-60,60),vy:rnd(-110,-40),life:rnd(0.6,1),c:f.kind==='bug'?'#ffe28a':'#c6f08f',r:rnd(2,4)});
  G.parts.push({x:m.x,y:m.y-20,vx:0,vy:-40,life:1.4,text:`+${xp}${bonus?' ⭐':''}`});
  tone(bonus?[660,880]:[587],0.045,'sine',0.07);
  if(SV.stage<STAGES.length-1){ SV.xp+=xp; if(SV.xp>=NEED[SV.stage]){SV.xp=NEED[SV.stage]; save(); updHud(); evolveOffer(); return;} }
  else SV.xp+=xp;
  save(); updHud();
}

/* ================== 进化 ================== */
function miniCv(cv,sp,w=440,h=280,t=1){const d=Math.min(devicePixelRatio||1,2); cv.width=w*d; cv.height=h*d; const x=cv.getContext('2d'); x.scale(d,d); fitDraw(x,sp,w,h,{t,rich:true},14);}
function evolveOffer(){
  G.paused=true; endIn();
  const opts=STAGES[SV.stage+1].opts;
  $('box').innerHTML=`<h1>✨ 可以进化啦！</h1><p>你吃得饱饱的，已经长大了。选一种恐龙变身吧：</p>
   <div class="choices">${opts.map(id=>{const s=SP[id]; return `<button class="choice" data-id="${id}"><canvas></canvas><b>${s.name}</b><div><span class="tag">🕰️ ${PERIODS[s.period].name}</span><span class="tag">📏 ${s.len}</span><span class="tag">🍽️ ${s.dietTxt}</span></div><div class="tr">${TRAITS[id]}</div></button>`;}).join('')}</div>`;
  $('overlay').classList.add('show');
  document.querySelectorAll('.choice').forEach(b=>{miniCv(b.querySelector('canvas'),SP[b.dataset.id]); b.onclick=()=>evolveTo(b.dataset.id);});
  tone([523,659,784,1046],0.05,'sine',0.14); say('可以进化啦，选一种恐龙吧');
}
function evolveTo(id){
  const from=curSp(); SV.stage++; SV.path[SV.stage]=id; SV.path.length=SV.stage+1; SV.xp=0; if(!SV.done.includes(id)) SV.done.push(id); save();
  const sp=SP[id];
  $('box').innerHTML=`<h1>🎉 变成${sp.name}了！</h1><canvas id="evoCv" style="width:100%;max-width:520px;aspect-ratio:22/13;border-radius:20px;background:linear-gradient(#dfeef0,#eef2dc)"></canvas>
    <p>💡 ${sp.facts[0]}</p><p style="color:#6c7563">${TRAITS[id]}</p>
    ${SV.stage===STAGES.length-1?'<p><b>这是最终形态！</b>继续在世界里散步、吃东西吧。想换一条路线，可以在菜单里“重新长大”。</p>':''}
    <button class="btn" id="goOn">继续冒险 ➜</button>`;
  // 变身动画：旧恐龙淡出，新恐龙淡入
  const c=$('evoCv'), d=Math.min(devicePixelRatio||1,2), w=520, h=307; c.width=w*d; c.height=h*d; const x=c.getContext('2d'); x.scale(d,d); const t0=performance.now();
  const loop=ts=>{ if(!$('overlay').classList.contains('show')||!c.isConnected) return; const k=Math.min(1,(ts-t0)/1600); x.clearRect(0,0,w,h);
    if(k<1){x.globalAlpha=1-k; fitDraw(x,from,w,h,{t:ts/1000,rich:true},30+k*40);} x.globalAlpha=k; fitDraw(x,sp,w,h,{t:ts/1000,rich:true},70-k*50); x.globalAlpha=1;
    if(k<1){const g=x.createRadialGradient(w/2,h/2,5,w/2,h/2,w*0.5); g.addColorStop(0,`rgba(255,248,210,${0.55*Math.sin(k*Math.PI)})`); g.addColorStop(1,'rgba(255,248,210,0)'); x.fillStyle=g; x.fillRect(0,0,w,h);}
    requestAnimationFrame(loop);}; requestAnimationFrame(loop);
  say('变成'+sp.name+'了');
  $('goOn').onclick=()=>{$('overlay').classList.remove('show'); G.paused=false; G.items.forEach(it=>it.told=false); for(let i=0;i<20;i++) spawnItem(true); updHud();};
}

  $('xpBar').style.width=(SV.stage<STAGES.length-1? SV.xp/NEED[SV.stage]*100 : 100)+'%';

}

/* ================== 主循环 ================== */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(ts-(last||ts))/1000); last=ts; G.t=ts/1000;
  if(!G.paused) updatePlayer(dt);
  // NPC
  for(const n of G.npcs){ const k=U()*n.sp.size*0.8*gs(n.d), spd=(30+n.sp.size*18)*(Math.min(H,W*0.85)/800);
    if(n.st==='walk'){const dx=n.tx-n.x; n.dir=dx>0?1:-1; n.x+=n.dir*Math.min(Math.abs(dx),spd*dt); n.phase+=dt*spd/(k*(n.sp.legs[0].l1+n.sp.legs[0].l2)*0.55); if(Math.abs(dx)<2){n.st='idle'; n.timer=rnd(2,6);}}
    else {n.timer-=dt; if(n.timer<=0){n.st='walk'; n.tx=Math.max(150,Math.min(G.W-150,n.x+rnd(-500,500)));}} }
  G.ptero.x+=G.ptero.dir*70*dt; if(G.ptero.x>G.W+300) G.ptero.dir=-1; if(G.ptero.x<-300) G.ptero.dir=1;
  // 相机
  const target=PL.x-W*0.5+PL.dir*W*0.08; G.camX+=(target-G.camX)*Math.min(1,dt*3); G.camX=Math.max(0,Math.min(G.W-W,G.camX));
  draw(dt);
}
function draw(dt){
  const hz=HZ(), cx=G.camX, t=G.t;
  // 天空
  let g=ctx.createLinearGradient(0,0,0,hz); g.addColorStop(0,'#6fa9d2'); g.addColorStop(0.55,'#b9d8e2'); g.addColorStop(1,'#f3e6c6'); ctx.fillStyle=g; ctx.fillRect(0,0,W,hz+H*0.15);
  const sx=W*0.78-cx*0.03, sy=H*0.13; g=ctx.createRadialGradient(sx,sy,6,sx,sy,H*0.3); g.addColorStop(0,'rgba(255,250,225,1)'); g.addColorStop(0.08,'rgba(255,244,205,.9)'); g.addColorStop(0.3,'rgba(255,236,190,.25)'); g.addColorStop(1,'rgba(255,236,190,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.6);
  // 云（有明暗）
  for(let i=0;i<6;i++){const span=W+500; const x=((i*380+t*(6+i)-cx*0.08)%span+span)%span-250, y=H*(0.07+(i%3)*0.07), s=0.8+(i%2)*0.5;
    [[0,0,46],[40,8,34],[-40,10,32],[14,-18,32]].forEach(([dx,dy,r])=>{const gg=ctx.createRadialGradient(x+dx*s-r*0.3*s,y+dy*s-r*0.4*s,2,x+dx*s,y+dy*s,r*s*1.2); gg.addColorStop(0,'rgba(255,255,255,.95)'); gg.addColorStop(1,'rgba(220,230,240,.0)'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x+dx*s,y+dy*s,r*s*1.2,0,Math.PI*2); ctx.fill();});}
  // 远景
  const bo=(cx*0.25)%Math.max(1,(back.w-W)); ctx.drawImage(back.c,-bo,0,back.w,back.h);
  // 火山烟
  G.smoke=G.smoke||[]; if(Math.random()<dt*0.8) G.smoke.push({x:back.vx,y:back.vy,r:8,a:0.45});
  G.smoke.forEach(p=>{p.y-=dt*8; p.x+=dt*5; p.r+=dt*3; p.a-=dt*0.04; const gg=ctx.createRadialGradient(p.x-bo,p.y,1,p.x-bo,p.y,p.r); gg.addColorStop(0,`rgba(240,236,232,${p.a})`); gg.addColorStop(1,'rgba(240,236,232,0)'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(p.x-bo,p.y,p.r,0,Math.PI*2); ctx.fill();}); G.smoke=G.smoke.filter(p=>p.a>0);
  // 地面
  const g0=gy(-0.2); g=ctx.createLinearGradient(0,g0,0,H); g.addColorStop(0,'#9cc277'); g.addColorStop(0.4,'#8fbb63'); g.addColorStop(1,'#6f9f4a'); ctx.fillStyle=g; ctx.fillRect(0,back.h-2,W,H);
  g=ctx.createLinearGradient(0,back.h-4,0,back.h+H*0.08); g.addColorStop(0,'rgba(220,232,210,.65)'); g.addColorStop(1,'rgba(220,232,210,0)'); ctx.fillStyle=g; ctx.fillRect(0,back.h-4,W,H*0.08);
  // 光斑（树影）
  for(let i=0;i<14;i++){const x=((i*397-cx)%(W+400)+W+400)%(W+400)-200, y=gy((i*0.137)%1); ctx.fillStyle='rgba(60,90,40,.10)'; ctx.beginPath(); ctx.ellipse(x,y,120,26,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,250,210,.07)'; ctx.beginPath(); ctx.ellipse(x+90,y+30,60,14,0,0,Math.PI*2); ctx.fill();}
  // 小路
  ctx.fillStyle='rgba(214,196,150,.45)'; ctx.beginPath(); for(let x=-20;x<=W+20;x+=20){const wx=x+cx; const y=gy(0.55+Math.sin(wx*0.0025)*0.25)-6; x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y);} for(let x=W+20;x>=-20;x-=20){const wx=x+cx; ctx.lineTo(x,gy(0.55+Math.sin(wx*0.0025)*0.25)+10);} ctx.closePath(); ctx.fill();
  // 草和石头
  ctx.lineCap='round';
  for(const r of G.rocks){const x=r.x-cx; if(x<-40||x>W+40) continue; const y=gy(r.d), k=gs(r.d); sphereRock(x,y,r.r*k);}
  for(const u of G.tufts){const x=u.x-cx; if(x<-10||x>W+10) continue; const y=gy(u.d), k=gs(u.d)*1.1; ctx.strokeStyle=u.c<0.5?'#6f9e48':'#5d8c3e'; ctx.lineWidth=1.8*k;
    for(let j=-1;j<=1;j++){ctx.beginPath(); ctx.moveTo(x+j*3*k,y); ctx.quadraticCurveTo(x+j*4*k,y-7*k,x+j*7*k+Math.sin(t+u.x)*1.5,y-13*k); ctx.stroke();}}
  for(const f of G.flowers){const x=f.x-cx; if(x<-10||x>W+10) continue; sphere(x,gy(f.d)-3,3*gs(f.d),f.c,false);}
  // 按深度排序绘制：树、食物、恐龙、玩家
  const list=[];
  for(const tr of G.trees){const x=tr.x-cx; if(x<-250||x>W+250) continue; list.push({y:gy(tr.d),f:()=>drawTree(x,{...tr,y:gy(tr.d)},Math.min(H,W*0.85)/800*gs(Math.max(0,tr.d)))});}
  for(const it of G.items){const x=it.x-cx; if(x<-80||x>W+80) continue; const y=gy(it.d); list.push({y,f:()=>drawFood(it,x,y-Math.abs(Math.sin(t*2+it.bob))*0,gs(it.d)*Math.min(H,W*0.85)/800*1.45)});}
  for(const n of G.npcs){const k=U()*n.sp.size*0.8*gs(n.d), x=n.x-cx; if(x<-400||x>W+400) continue; list.push({y:gy(n.d),f:()=>drawDinoAt(n.sp,x,gy(n.d),k,n.dir,{t:t+n.t0,moving:n.st==='walk',phase:n.phase})});}
  { const k=pScale(), x=PL.x-cx, y=gy(PL.d); list.push({y:y+0.1,f:()=>{
      if(PL.grow>0){const gg=ctx.createRadialGradient(x,y-40*k/U()*0.5,4,x,y-40*k/U()*0.5,180*k/U()*0.5); gg.addColorStop(0,`rgba(255,245,200,${0.35*PL.grow})`); gg.addColorStop(1,'rgba(255,245,200,0)'); ctx.fillStyle=gg; ctx.fillRect(x-300,y-300,600,400);}
      const bump=PL.bump>0?Math.sin(PL.bump*20)*2*PL.bump:0;
      drawDinoAt(curSp(),x+bump,y,k*(1+PL.munch*0.03),PL.dir,{t:t,moving:PL.moving,phase:PL.phase},true);
      // 小箭头标出自己
      ctx.fillStyle='rgba(255,252,240,.9)'; const b=bbox(curSp()); const ax=x+PL.dir*(b.x+b.w*0.55)*k, ay=y+b.y*k-16+Math.sin(t*3)*3; ctx.beginPath(); ctx.moveTo(ax-9,ay-10); ctx.lineTo(ax+9,ay-10); ctx.lineTo(ax,ay); ctx.closePath(); ctx.fill();
    }}); }
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  // 翼龙
  { const pt=G.ptero, x=pt.x-cx*1.0; if(x>-200&&x<W+200){ctx.save(); ctx.translate(x,H*pt.y+Math.sin(t*0.7)*14); const k=U()*0.55; ctx.scale(pt.dir*k,k); drawDino(ctx,SP.ptero,{t:t+pt.t0,rich:true}); ctx.restore();} }
  // 粒子
  G.parts.forEach(p=>{p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=200*dt*(p.text?0:1); const x=p.x-cx; ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));
    if(p.text){ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(60,50,30,.6)'; ctx.strokeText(p.text,x,p.y); ctx.fillStyle='#fff6d0'; ctx.fillText(p.text,x,p.y);}
    else {ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(x,p.y,p.r,0,Math.PI*2); ctx.fill();} ctx.globalAlpha=1;});
  G.parts=G.parts.filter(p=>p.life>0);
  // 飘浮的花粉光点
  G.motes.forEach(m=>{m.y-=m.v*dt; m.x+=Math.sin(t*0.5+m.s)*0.0006; if(m.y<0) m.y=1; ctx.fillStyle='rgba(255,250,215,.55)'; ctx.beginPath(); ctx.arc(((m.x*W*1.3-cx*0.6)%W+W)%W, H*0.25+m.y*H*0.7, m.s,0,Math.PI*2); ctx.fill();});
  // 柔和暗角
  g=ctx.createRadialGradient(W/2,H*0.55,Math.min(W,H)*0.45,W/2,H*0.55,Math.max(W,H)*0.85); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(20,30,15,.28)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function sphereRock(x,y,r){const g=ctx.createRadialGradient(x-r*0.4,y-r*0.6,1,x,y-r*0.2,r*1.4); g.addColorStop(0,'#d8d0bd'); g.addColorStop(0.6,'#a79c86'); g.addColorStop(1,'#7c725f'); ctx.fillStyle='rgba(30,40,20,.25)'; ctx.beginPath(); ctx.ellipse(x+3,y+1,r*1.5,r*0.35,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y-r*0.3,r*1.4,r*0.8,0,Math.PI,0); ctx.quadraticCurveTo(x,y+r*0.15,x-r*1.4,y-r*0.3); ctx.fill();}
function drawDinoAt(sp,x,y,k,dir,o,isPlayer){
  const b=bbox(sp); ctx.save(); ctx.translate(x,y);
  const cxs=dir*(b.x+b.w*0.55)*k, rx=b.w*0.42*k, ry=Math.max(6,b.w*0.06*k);
  const g=ctx.createRadialGradient(cxs,0,1,cxs,0,rx); g.addColorStop(0,'rgba(20,35,15,.42)'); g.addColorStop(0.6,'rgba(20,35,15,.18)'); g.addColorStop(1,'rgba(20,35,15,0)'); ctx.fillStyle=g; ctx.save(); ctx.scale(1,ry/rx); ctx.beginPath(); ctx.arc(cxs,0,rx,0,Math.PI*2); ctx.restore(); ctx.save(); ctx.translate(cxs,2); ctx.scale(1,ry/rx); ctx.beginPath(); ctx.arc(0,0,rx,0,Math.PI*2); ctx.fillStyle=g; ctx.restore();
  ctx.fillStyle='rgba(20,35,15,.25)'; ctx.beginPath(); ctx.ellipse(cxs,2,rx*0.8,ry,0,0,Math.PI*2); ctx.fill();
  ctx.scale(dir*k,k); drawDino(ctx,sp,Object.assign({rich:true},o)); ctx.restore();
}
