<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>恐龙长大记 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;background:#9fd6f2;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#3b4636}
#game canvas{display:block;touch-action:none}
button{font-family:inherit;border:0;cursor:pointer}
.panel{background:rgba(255,252,242,.93);border-radius:22px;padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#hud{position:fixed;left:14px;top:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
#who{display:flex;align-items:center;gap:10px}
#who img{width:92px;height:58px;object-fit:contain}
#who b{font-size:22px;display:block} #who small{font-size:15px;color:#6c7563}
.xp{height:14px;width:220px;background:#e8e1cf;border-radius:8px;overflow:hidden;margin-top:6px;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fd16a,#4fb24a);border-radius:8px;transition:width .4s}
.stages{display:flex;gap:6px;margin-top:6px}.stages i{width:16px;height:16px;border-radius:50%;background:#e2dccb}.stages i.on{background:#f2b33d}
.btns{display:flex;gap:10px}
.ib{width:56px;height:56px;border-radius:50%;background:rgba(255,252,242,.93);font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#mapBox{position:fixed;left:14px;bottom:14px;z-index:3;padding:6px;border-radius:18px}
#map{display:block;width:150px;height:150px;border-radius:12px}
#tip{position:fixed;left:50%;top:96px;transform:translateX(-50%);font-size:21px;font-weight:700;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;z-index:4;max-width:min(680px,90vw);line-height:1.5}
#tip.show{opacity:1} #tip .small{font-weight:400;font-size:16px}
#foodArrow{position:fixed;display:none;align-items:center;justify-content:center;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:2;pointer-events:none}
#foodArrow i{position:absolute;inset:-14px}
#foodArrow i::after{content:'';position:absolute;right:0;top:50%;margin-top:-12px;border:12px solid transparent;border-left:18px solid #fff6c8;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
#foodArrow b{width:40px;height:40px;border-radius:50%;background:rgba(255,252,242,.95);box-shadow:0 3px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:24px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2}
.ftxt{position:absolute;left:0;top:0;font-size:26px;font-weight:800;color:#fff6d0;text-shadow:0 2px 0 #6b5a2c,0 0 8px rgba(80,60,20,.6)}
#overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(30,40,25,.3),rgba(20,25,15,.62));display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#overlay.show{display:flex}
.box{touch-action:pan-y;-webkit-overflow-scrolling:touch;background:linear-gradient(#fffdf5,#f4ecd8);border-radius:30px;padding:22px 26px;max-width:780px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;max-height:94vh;overflow-y:auto}
.box h1{font-size:34px;margin:4px 0 8px;color:#4f6e3f}.box p{font-size:19px;line-height:1.7;margin:6px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0 6px}
.choice{background:#fff;border-radius:24px;padding:12px 10px 16px;box-shadow:0 6px 0 #e3d8bd,0 10px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.choice:hover{transform:translateY(-4px)} .choice img{width:100%;max-width:320px;aspect-ratio:36/23;object-fit:contain;background:linear-gradient(#e5f4fb,#f3f0dc);border-radius:16px}
.choice b{font-size:26px} .tag{display:inline-block;background:#f1ead6;border-radius:10px;padding:3px 8px;margin:3px;font-size:14px}.tr{font-size:15px;color:#5a7a3a}
img.big{width:100%;max-width:460px;border-radius:20px;background:linear-gradient(#e5f4fb,#f3f0dc)}
.btn{background:#6fa45f;color:#fff;font-size:23px;font-weight:700;padding:13px 32px;border-radius:30px;box-shadow:0 4px 0 #4f8341;margin:10px 6px 0}
.btn.light{background:#fff;color:#3b4636;box-shadow:0 4px 0 #ddd6c4}
.wait .choice,.wait .btn{pointer-events:none;opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.legend span{background:#fff;border-radius:14px;padding:6px 10px;font-size:15px;box-shadow:0 3px 0 #e6dfcc}
.credits{font-size:13px!important;color:#8a8576;line-height:1.6!important}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#9fd6f2,#e9f4d8);z-index:20;font-size:24px;font-weight:700;color:#4f6e3f}
#loading .egg{font-size:70px;animation:wob 2s ease-in-out infinite}@keyframes wob{50%{transform:rotate(8deg)}}
@media (max-width:700px){.xp{width:140px}#who img{display:none}.choices{grid-template-columns:1fr}#map{width:110px;height:110px}}

#joy{display:none;position:fixed;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(255,252,242,.35);border:3px solid rgba(255,255,255,.75);z-index:3;touch-action:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,252,242,.95);box-shadow:0 4px 10px rgba(0,0,0,.25);pointer-events:none}
.box #startBtn,.box #goOn{position:sticky;bottom:0}
body.mob #joy{display:block}
body.mob #mapBox{left:auto;right:12px;top:78px;bottom:auto;padding:4px;border-radius:14px}
body.mob #map{width:96px;height:96px;border-radius:10px}
body.mob #hud{left:10px;top:10px;right:10px}
body.mob #who{padding:6px 12px;gap:6px}
body.mob #who b{font-size:17px} body.mob #who small{font-size:12px}
body.mob .xp{width:120px;height:10px} body.mob .stages i{width:11px;height:11px}
body.mob #who img{width:60px;height:38px;display:block}
body.mob .ib{width:46px;height:46px;font-size:21px}
body.mob #tip{top:auto;bottom:170px;font-size:16px;padding:8px 12px;max-width:88vw}
body.mob #tip .small{font-size:13px}
body.mob .ftxt{font-size:20px}
@media (max-width:820px), (max-height:520px){
 .box{padding:14px 14px;border-radius:22px} .box h1{font-size:24px;margin:2px 0 4px} .box p{font-size:15px;line-height:1.55}
 .legend{gap:5px} .legend span{font-size:13px;padding:4px 8px}
 .btn{font-size:19px;padding:10px 24px} .choice b{font-size:20px} .tag{font-size:12px} .tr{font-size:13px}
}
@media (max-height:520px){ .choices{grid-template-columns:1fr 1fr!important;gap:10px;margin:8px 0} .choice img{max-width:200px} img.big{max-width:260px} body.mob #tip{top:auto;bottom:12px;max-width:52vw} body.mob #joy{width:116px;height:116px;left:16px;bottom:14px} }
.lcol{display:flex;flex-direction:column;align-items:flex-start;gap:8px} #quest{padding:9px 14px;border-radius:16px;font-size:17px;font-weight:700;max-width:min(360px,60vw);transition:background .6s,transform .6s}
#quest.done{background:rgba(255,236,150,.95);transform:scale(1.05)}
#questArrow{display:none;margin-left:8px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid #e08a00;vertical-align:middle}
#dashBtn{position:fixed;right:24px;bottom:24px;z-index:3;width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:#ff9a3c;color:#fff;font-size:20px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.25);touch-action:none;transition:opacity .4s,background .4s}
#dashBtn small{display:block;font-size:12px;font-weight:600}
#dashBtn.cd{background:#b9a690;opacity:.65}
#comboTxt{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:4;font-size:30px;font-weight:900;color:#ff8a00;text-shadow:0 2px 0 #fff,0 0 8px #fff;opacity:0;pointer-events:none}
#comboTxt.pop{animation:cpop 1.4s ease-out}
@keyframes cpop{0%{opacity:0;transform:translateX(-50%) scale(.8)}20%{opacity:1;transform:translateX(-50%) scale(1.08)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
body.mob #quest{font-size:13px;padding:6px 10px;max-width:56vw} body.mob .lcol{gap:5px}
body.mob #dashBtn{right:18px;bottom:22px;width:88px;height:88px;font-size:17px}
body.mob #comboTxt{top:auto;bottom:120px;font-size:24px}
@media (max-height:520px){ body.mob #dashBtn{width:76px;height:76px;bottom:14px} }
@media (max-width:560px){ .choices{grid-template-columns:1fr 1fr!important;gap:8px} .choice{padding:8px 6px 10px} .choice .tag{display:none} .choice b{font-size:19px} }
</style></head><body>
<div id="game"></div>
<div id="fx"></div>
<div id="joy"><i></i></div>
<div id="foodArrow"><i></i><b></b></div>
<div id="hud">
  <div class="lcol"><div class="panel" id="who"><img id="whoImg" alt=""><div><b id="whoName">恐龙宝宝</b><small id="whoSub">第 1 阶段</small><div class="xp"><i id="xpBar"></i></div><div class="stages" id="stages"></div></div></div>
  <div id="quest" class="panel"><span id="questTxt">🎯</span><i id="questArrow"></i></div></div>
  <div class="btns"><button class="ib" id="soundBtn" title="声音">🔇</button><button class="ib" id="menuBtn" title="菜单">☰</button></div>
</div>
<div class="panel" id="mapBox"><canvas id="map" width="150" height="150"></canvas></div>
<div id="tip" class="panel"></div>
<button id="dashBtn">💨<small>冲刺</small></button>
<div id="comboTxt"></div>
<div id="overlay"><div class="box" id="box"></div></div>
<div id="loading"><div class="egg">🥚</div><div id="loadTxt">正在加载…</div></div>
