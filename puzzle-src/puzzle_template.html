<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>恐龙拼图</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fbf4e4;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#3b4636}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.screen{position:fixed;inset:0;display:none}
.screen.show{display:block}
.bar{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:10px;padding:0 16px;z-index:5}
.bar h1{margin:0;font-size:28px;flex:1;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:18px;color:#7a806e;font-weight:400;margin-left:10px}
.ib{min-width:58px;height:58px;border-radius:29px;background:#fffdf6;box-shadow:0 4px 12px rgba(80,60,20,.16);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:19px;font-weight:700;flex:none}
.ib .e{font-size:24px}
.ib.on{background:#ffe7a6}
.ib:active{transform:scale(.96)}
.ib:disabled{opacity:.4}
/* home */
#home .wrap{position:absolute;top:76px;left:0;right:0;bottom:0;overflow:auto;padding:4px 22px 30px}
.sizes{display:flex;gap:12px;justify-content:center;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.sizes span{font-size:20px;font-weight:700;margin-right:4px}
.sz{min-width:92px;height:62px;border-radius:20px;background:#fffdf6;font-size:21px;font-weight:800;box-shadow:0 4px 12px rgba(80,60,20,.14);display:flex;align-items:center;justify-content:center;gap:6px;border:4px solid transparent;padding:0 12px}
.sz.sel{border-color:#f2b33d;background:#fff3cf}
.sz small{font-size:13px;font-weight:400;color:#8a8f7d;display:block;line-height:1}
.hintline{text-align:center;color:#8a8f7d;font-size:16px;margin-bottom:16px}
.sec{font-size:22px;font-weight:800;margin:18px auto 12px;max-width:1400px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0 auto 16px;max-width:1400px}
.tab{height:52px;border-radius:26px;padding:0 20px;background:#fffdf6;font-size:19px;font-weight:700;box-shadow:0 3px 10px rgba(80,60,20,.12);border:3px solid transparent}
.tab.sel{border-color:#8fd16a;background:#effae6}
.tab small{color:#8a8f7d;font-weight:400;margin-left:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;max-width:1400px;margin:0 auto}
.card{background:#fffdf6;border-radius:24px;padding:10px;box-shadow:0 6px 16px rgba(80,60,20,.15);cursor:pointer;position:relative;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .im{width:100%;aspect-ratio:2/1;background-size:cover;background-position:center;border-radius:16px}
.card .t{font-size:20px;font-weight:700;padding:10px 6px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .stars{font-size:15px;color:#f2b33d;white-space:nowrap}
.card .resume{position:absolute;left:18px;top:18px;background:#8fd16a;color:#fff;font-weight:800;border-radius:14px;padding:4px 12px;font-size:16px}
.card .del{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.9);font-size:18px}
.card.add{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;border:3px dashed #e3c98a;background:#fffaf0;font-size:20px;font-weight:700;color:#8a7a4c}
.card.add .plus{font-size:48px}
/* play */
#play{background:radial-gradient(ellipse at 40% 40%,#fffaf0,#f3e7cc)}
#board{position:absolute;border-radius:6px;background:#e9dcbc;box-shadow:inset 0 2px 10px rgba(80,60,20,.25),0 0 0 3px #e0cfa4}
#ghost,#full{position:absolute;inset:0;width:100%;height:100%;border-radius:6px}
#full{opacity:0;transition:opacity 1.2s;pointer-events:none}
#pieces{position:absolute;inset:0}
.pc{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.pc.lift{filter:drop-shadow(0 8px 10px rgba(40,30,10,.35))}
.pc.glide{transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.pc.dim{opacity:.18}
.pc.flash{animation:flash .7s}
@keyframes flash{0%{filter:brightness(1.4)}100%{filter:brightness(1)}}
.quiet .pc.flash{animation:none}
#hit{position:absolute;inset:0;touch-action:none}
#count{font-size:21px;font-weight:800;background:#fffdf6;border-radius:29px;height:58px;padding:0 18px;display:flex;align-items:center;box-shadow:0 4px 12px rgba(80,60,20,.16);flex:none}
#ref{position:absolute;right:16px;bottom:16px;border-radius:14px;box-shadow:0 8px 22px rgba(40,30,10,.3);border:5px solid #fffdf6;display:none;z-index:900;pointer-events:none}
#ref.show{display:block}
#saved{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:#fffdf6;border-radius:16px;padding:6px 16px;font-size:16px;color:#6b705f;opacity:0;transition:opacity .4s;pointer-events:none;z-index:6}
/* done */
#doneBox{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;transition:all .6s;background:#fffdf6;border-radius:28px;padding:16px 24px;box-shadow:0 10px 30px rgba(60,40,10,.25);text-align:center;z-index:2000;pointer-events:none;width:min(600px,94vw)}
#doneBox.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#doneBox h2{margin:0 0 4px;font-size:30px}
#doneBox p{margin:0 0 12px;font-size:19px;color:#6b705f}
#doneBox .stk{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;font-size:18px;font-weight:700;color:#8a6b20}
.sticker{width:76px;height:76px;border-radius:50%;background-size:cover;background-position:center;border:5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.25);position:relative;flex:none}
.sticker b{position:absolute;right:-8px;bottom:-6px;background:#f2b33d;color:#fff;border-radius:12px;font-size:13px;padding:2px 7px;border:2px solid #fff}
.sticker.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.quiet .sticker.pop{animation:none}
.big{height:60px;border-radius:30px;padding:0 24px;font-size:20px;font-weight:800;background:#8fd16a;color:#fff;box-shadow:0 5px 0 #5fa648;margin:4px 5px}
.big.light{background:#fff3cf;color:#6b5a2c;box-shadow:0 5px 0 #e3c98a}
.big:active{transform:translateY(3px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1500;overflow:hidden}
.star{position:absolute;font-size:28px;animation:rise 2.4s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translateY(-220px) scale(1.1);opacity:0}}
/* sticker book */
#book .wrap{position:absolute;top:76px;left:0;right:0;bottom:0;overflow:auto;padding:10px 22px 30px}
.brow{display:flex;align-items:center;gap:14px;background:#fffdf6;border-radius:20px;padding:12px 16px;margin:0 auto 12px;max-width:1100px;box-shadow:0 3px 10px rgba(80,60,20,.1)}
.brow .nm{width:200px;font-size:18px;font-weight:700}
.brow .slots{display:flex;gap:14px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;max-width:1300px;margin:0 auto}
.bcell{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;text-align:center;color:#6b705f}
.slot{width:76px;height:76px;border-radius:50%;border:3px dashed #e0d3b0;display:flex;align-items:center;justify-content:center;color:#c9bb94;font-weight:700;font-size:15px}
/* dialogs */
.dlg{position:fixed;inset:0;background:rgba(40,35,20,.35);display:none;align-items:center;justify-content:center;z-index:3000}
.dlg.show{display:flex}
.dlg .p{background:#fffdf6;border-radius:28px;padding:22px 28px;width:min(580px,92vw);max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dlg h2{margin:0 0 10px;font-size:25px}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee3c8;font-size:19px;gap:12px}
.row small{display:block;color:#8a8f7d;font-size:14px}
.tg{width:76px;height:42px;border-radius:21px;background:#ddd5c0;position:relative;flex:none;transition:background .2s}
.tg::after{content:'';position:absolute;left:4px;top:4px;width:34px;height:34px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tg.on{background:#8fd16a}.tg.on::after{left:38px}
.credits{font-size:13px;color:#7a806e;line-height:1.6;margin-top:12px}
@media(max-width:1100px){#ptitle{display:none}.ib .t{display:none}}
@media(max-width:700px){.ib{padding:0 12px;min-width:50px;height:52px}.bar{gap:6px;padding:0 8px}}
</style></head><body>

<div id="home" class="screen show">
  <div class="bar"><h1>🦕 恐龙拼图<span class="sub">选一张图，开始拼吧</span></h1>
    <button class="ib" id="bookBtn"><span class="e">📒</span><span class="t">贴纸本</span></button>
    <button class="ib" id="setBtn1" title="设置"><span class="e">⚙️</span></button></div>
  <div class="wrap">
    <div class="sizes" id="sizes"><span>几块：</span></div>
    <div class="hintline" id="sizeHint"></div>
    <div class="tabs" id="tabs"></div><div id="galleries"></div>
  </div>
</div>

<div id="book" class="screen">
  <div class="bar"><button class="ib" id="bookBack"><span class="e">⬅️</span>返回</button><h1>📒 我的恐龙贴纸本 <span class="sub" id="bookCount"></span></h1></div>
  <div class="wrap" id="bookWrap"></div>
</div>

<div id="play" class="screen">
  <div class="bar">
    <button class="ib" id="backBtn"><span class="e">🏠</span><span class="t">换图</span></button>
    <h1 id="ptitle" style="font-size:22px"></h1>
    <div id="count">0 / 4</div>
    <button class="ib" id="undoBtn" title="撤回"><span class="e">↩️</span><span class="t">撤回</span></button>
    <button class="ib" id="edgeBtn" title="先拼边框"><span class="e">🔲</span><span class="t">边框</span></button>
    <button class="ib" id="refBtn" title="看原图"><span class="e">🖼️</span><span class="t">看图</span></button>
    <button class="ib" id="hintBtn" title="帮我放一块"><span class="e">🪄</span><span class="t">帮我</span></button>
    <button class="ib" id="soundBtn" title="声音"><span class="e">🔈</span></button>
    <button class="ib" id="setBtn2" title="设置"><span class="e">⚙️</span></button>
  </div>
  <div id="board"><canvas id="ghost"></canvas><canvas id="full"></canvas></div>
  <div id="pieces"></div>
  <div id="hit"></div>
  <img id="ref" alt="">
  <div id="saved">已自动保存 ✓</div>
</div>

<div id="doneBox"><h2 id="doneT">拼好啦！🎉</h2><p id="doneP"></p>
  <div class="stk" id="doneStk"></div>
  <div><button class="big" id="harderBtn">试试更多块</button><button class="big light" id="againBtn">再拼一次</button><button class="big light" id="nextBtn">下一张 ➜</button></div></div>
<div id="fx"></div>

<div id="setBox" class="dlg"><div class="p">
  <h2>⚙️ 设置</h2>
  <div class="row"><div>🔈 轻柔音效<small>拿起、拼上时小小的叮咚声</small></div><button class="tg" data-k="sound"></button></div>
  <div class="row"><div>🎵 背景音乐<small>很慢很轻的音乐</small></div><button class="tg" data-k="music"></button></div>
  <div class="row"><div>🗣️ 说话夸奖<small>拼好后用声音说"真棒"</small></div><button class="tg" data-k="voice"></button></div>
  <div class="row"><div>🌙 安静模式<small>关掉所有声音、星星和闪光</small></div><button class="tg" data-k="quiet"></button></div>
  <div class="row"><div>🧲 大磁铁<small>吸附范围大一些（更容易）</small></div><button class="tg" data-k="magnet"></button></div>
  <div class="row"><div>👻 淡底图<small>拼图板上印一层很淡的原图（最容易）</small></div><button class="tg" data-k="ghost"></button></div>
  <div class="row"><div>✏️ 拼块格线<small>拼图板上画出每一块的位置</small></div><button class="tg" data-k="grid"></button></div>
  <div class="credits" id="credits"></div>
  <div style="text-align:center;margin-top:12px"><button class="big" id="setClose">好了</button></div>
</div></div>
<input type="file" id="fileIn" accept="image/*" style="display:none">

<script src="pictures.js"></script>
<script>
const IMGS={},THUMBS={};
const PICS=(window.PUZZLE_PICS||[]).map(p=>{IMGS[p.id]='images/'+p.id+'.webp';THUMBS[p.id]='thumbs/'+p.id+'.webp';return p;});
const SETS=(window.PUZZLE_SETS||[]).concat([['mine','📷 我的图片']]);
const LEVELS=[4,9,16,24,36,48];
const LVHINT=['刚开始','简单','中等','有点难','难','很难'];
const SNAP=[0.5,0.42,0.34,0.3,0.27,0.24];
const $=id=>document.getElementById(id);
const KEY='dinoPuzzle2';
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
S=Object.assign({sound:true,music:false,voice:false,quiet:matchMedia('(prefers-reduced-motion: reduce)').matches,magnet:false,ghost:false,grid:false,lv:2,stickers:{},saves:{}},S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- my pictures (IndexedDB) ---------- */
const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('dinoPuzzleImgs',1);q.onupgradeneeded=()=>q.result.createObjectStore('imgs',{keyPath:'id'});q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r();}catch(e){r()}})},
  all(){return new Promise(r=>{if(!this.db)return r([]);const q=this.db.transaction('imgs').objectStore('imgs').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);})},
  put(o){return new Promise(r=>{if(!this.db)return r();const t=this.db.transaction('imgs','readwrite');t.objectStore('imgs').put(o);t.oncomplete=r;t.onerror=r;})},
  del(id){return new Promise(r=>{if(!this.db)return r();const t=this.db.transaction('imgs','readwrite');t.objectStore('imgs').delete(id);t.oncomplete=r;t.onerror=r;})},
};
async function loadMine(){
  for(let i=PICS.length-1;i>=0;i--) if(PICS[i].set==='mine') PICS.splice(i,1);
  const all=await DB.all();
  all.sort((a,b)=>a.t-b.t).forEach((o,k)=>{IMGS[o.id]=o.src;THUMBS[o.id]=o.src;PICS.push({id:o.id,set:'mine',ar:o.ar,name:'我的图片 '+(k+1),praise:'你把自己的图片拼好啦！'});});
}
$('fileIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const url=URL.createObjectURL(f);const im=new Image();im.src=url;try{await im.decode();}catch(err){return;}
  let ar=im.width/im.height;ar=Math.max(1.2,Math.min(2.2,ar));
  const W=Math.min(2000,im.width),H=Math.round(W/ar);
  const sw=Math.min(im.width,im.height*ar),sh=sw/ar;
  const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,W,H);
  URL.revokeObjectURL(url);
  await DB.put({id:'mine'+Date.now(),src:c.toDataURL('image/jpeg',0.88),ar,t:Date.now()});
  await loadMine();buildHome();
};

/* ---------- sound ---------- */
let AC=null,master=null,musicTimer=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);}if(AC.state==='suspended')AC.resume();return AC;}
function tone(freq,t0=0,dur=0.5,vol=0.12,type='sine'){
  const a=ac(),t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain(),o2=a.createOscillator(),g2=a.createGain();
  o.type=type;o.frequency.value=freq;o2.frequency.value=freq*2;g2.gain.value=0.18;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+dur+0.05);o2.stop(t+dur+0.05);}
const canSound=()=>S.sound&&!S.quiet;
const sfx={pick(){if(canSound())tone(660,0,0.16,0.04)},join(){if(canSound()){tone(698,0,0.35,0.06)}},
  snap(){if(canSound()){tone(784,0,0.5,0.08);tone(1047,0.09,0.7,0.07)}},
  done(){if(canSound())[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.16,1.1,0.08))},
  sticker(){if(canSound()){tone(1319,0,0.4,0.05);tone(1568,0.1,0.6,0.05)}}};
const PENTA=[262,294,330,392,440,523,587,659];
function musicTick(){if(!(S.music&&!S.quiet))return;const f=PENTA[Math.floor(Math.random()*8)];tone(f/2,0,2.8,0.035,'triangle');if(Math.random()<0.5)tone(f,0.6,2.4,0.025);}
function setMusic(){clearInterval(musicTimer);if(S.music&&!S.quiet){ac();musicTick();musicTimer=setInterval(musicTick,1900);}}
function speak(t){if(!(S.voice&&!S.quiet&&window.speechSynthesis))return;try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=0.85;u.pitch=1.1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* ---------- images ---------- */
const imgEl={};
function loadImg(id){if(!imgEl[id]){const im=new Image();im.src=IMGS[id];imgEl[id]=im.decode().then(()=>im).catch(e=>{delete imgEl[id];throw e;});}return imgEl[id];}
function gridFor(n,ar){let rows=Math.max(2,Math.round(Math.sqrt(n/ar)));let cols=Math.max(2,Math.round(n/rows));return [cols,rows];}

/* ---------- home ---------- */
function buildHome(){
  const sz=$('sizes');sz.querySelectorAll('.sz').forEach(e=>e.remove());
  LEVELS.forEach((n,i)=>{const b=document.createElement('button');b.className='sz'+(S.lv===i?' sel':'');
    b.innerHTML=`<div>${n} 块<small>${LVHINT[i]}</small></div>`;b.onclick=()=>{S.lv=i;save();buildHome();sfx.pick();};sz.appendChild(b);});
  $('sizeHint').textContent=S.lv<=1?'4、9 块会在拼图板上画出每块的位置':'16 块以上：拼图板是空的，拼块打乱放在旁边，可以先把几块拼在一起';
  if(!S.cat||!SETS.some(t=>t[0]===S.cat))S.cat=SETS[0][0];
  const tb=$('tabs');tb.innerHTML='';
  for(const [set,title] of SETS){const b=document.createElement('button');b.className='tab'+(S.cat===set?' sel':'');
    b.innerHTML=`${title}<small>${PICS.filter(p=>p.set===set).length||''}</small>`;b.onclick=()=>{S.cat=set;save();buildHome();$('home').querySelector('.wrap').scrollTop=0;};tb.appendChild(b);}
  const G=$('galleries');G.innerHTML='';
  {const set=S.cat;
    const g=document.createElement('div');g.className='gallery';G.appendChild(g);
    PICS.filter(p=>p.set===set).forEach(p=>{
      const i=PICS.indexOf(p);const d=document.createElement('div');d.className='card';
      const got=LEVELS.filter((n,k)=>S.stickers[p.id+'_'+k]).length;
      const sv=S.saves[p.id+'_'+S.lv];
      d.innerHTML=`<div class="im" style="background-image:url('${THUMBS[p.id]}')"></div><div class="t"><span>${p.name}</span><span class="stars">${'★'.repeat(got)}${'☆'.repeat(LEVELS.length-got)}</span></div>${sv?'<div class="resume">▶ 接着拼</div>':''}`;
      if(set==='mine'){const x=document.createElement('button');x.className='del';x.textContent='✕';x.title='删除这张图';
        x.onclick=async ev=>{ev.stopPropagation();x.textContent='确定?';if(x.dataset.c){await DB.del(p.id);delete IMGS[p.id];await loadMine();buildHome();}x.dataset.c=1;};d.appendChild(x);}
      d.onclick=()=>startGame(i);g.appendChild(d);});
    if(set==='mine'){const a=document.createElement('div');a.className='card add';a.innerHTML='<div class="plus">＋</div><div>用电脑里的图片做拼图</div><div style="font-size:14px;font-weight:400;margin-top:6px">比如从网上下载的恐龙图、家人的照片</div>';a.onclick=()=>$('fileIn').click();g.appendChild(a);}
  }
}

/* ---------- puzzle geometry ---------- */
function rng(seed){return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}
function makeEdges(c,r,rand){const h=[],v=[];for(let y=0;y<r;y++){h.push([]);v.push([]);for(let x=0;x<c;x++){h[y].push(y<r-1?(rand()<0.5?1:-1):0);v[y].push(x<c-1?(rand()<0.5?1:-1):0);}}return {h,v};}
function piecePath(ctx,x,y,w,h,E){
  const top=y===0?0:-E.h[y-1][x],bottom=E.h[y][x],left=x===0?0:-E.v[y][x-1],right=E.v[y][x],s=Math.min(w,h);
  ctx.moveTo(0,0);edge(ctx,0,0,w,0,top,s);edge(ctx,w,0,w,h,right,s);edge(ctx,w,h,0,h,bottom,s);edge(ctx,0,h,0,0,left,s);ctx.closePath();}
function edge(ctx,x1,y1,x2,y2,sign,s){
  if(!sign){ctx.lineTo(x2,y2);return;}
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=uy*sign,ny=-ux*sign;
  const P=(a,b)=>[x1+ux*a*L+nx*b*s,y1+uy*a*L+ny*b*s];
  const pts=[[P(0.34,0)],[P(0.42,0),P(0.40,0.06),P(0.38,0.12)],[P(0.34,0.22),P(0.42,0.27),P(0.5,0.27)],[P(0.58,0.27),P(0.66,0.22),P(0.62,0.12)],[P(0.60,0.06),P(0.58,0),P(0.66,0)]];
  ctx.lineTo(...pts[0][0]);for(let i=1;i<5;i++)ctx.bezierCurveTo(...pts[i][0],...pts[i][1],...pts[i][2]);ctx.lineTo(x2,y2);}

/* ---------- game state ----------
 group origin (ox,oy) = where piece(0,0)'s body top-left is, in board-width units relative to board top-left.
 a group whose origin is (0,0) is placed on the board. */
let G=null,hitCtx=document.createElement('canvas').getContext('2d');
async function startGame(pi,fresh){
  const p=PICS[pi];const lv=S.lv;const [c,r]=gridFor(LEVELS[lv],p.ar);
  let im;try{im=await loadImg(p.id);}catch(e){alert('这张图片没找到。请确认 images 文件夹和网页放在一起。');return;}
  $('pieces').innerHTML='';$('fx').innerHTML='';$('doneBox').classList.remove('show');
  ['home','book'].forEach(s=>$(s).classList.remove('show'));$('play').classList.add('show');
  $('ptitle').textContent=p.name;$('ref').src=IMGS[p.id];
  const key=p.id+'_'+lv,sv=fresh?null:S.saves[key];
  const seed=sv?sv.seed:Math.floor(Math.random()*1e9)+1;
  G={pi,p,im,c,r,lv,key,seed,E:makeEdges(c,r,rng(seed)),pieces:[],groups:[],undo:[],finished:false,edge:false};
  for(let k=0;k<c*r;k++){const el=document.createElement('canvas');el.className='pc';$('pieces').appendChild(el);G.pieces.push({k,x:k%c,y:Math.floor(k/c),el,g:null});}
  layout(true);
  if(sv&&sv.groups){G.groups=[];sv.groups.forEach(s=>{const g={ox:s[0],oy:s[1],ps:s[2].map(k=>G.pieces[k])};g.ps.forEach(o=>o.g=g);G.groups.push(g);});}
  else scatter();
  G.zs=G.groups.slice();
  $('ref').classList.toggle('show',lv<=1);$('refBtn').classList.toggle('on',lv<=1);
  G.edge=false;$('edgeBtn').classList.remove('on');$('edgeBtn').style.display=lv>=2?'':'none';
  $('full').style.opacity=0;
  render();updCount();updUndo();
}
function layout(first){
  if(!G)return;
  const vw=innerWidth,vh=innerHeight,top=84,pad=14,AR=G.p.ar,land=vw/vh>1.1;
  let bw,bh,bx,by,zones;
  const share=[0.85,0.62,0.5,0.46,0.44,0.42][G.lv]; // board share of usable width/height
  if(land){
    bw=Math.min((vw-pad*2)*share*(AR>1.8?1.08:1),(vh-top-pad)*0.78*AR);bh=bw/AR;bx=pad+8;by=top+6;
    zones=[[bx+bw+pad,top,vw-pad,vh-pad],[pad,by+bh+pad,bx+bw,vh-pad]];
  }else{
    bw=vw-pad*2-16;bh=bw/AR;bx=pad+8;by=top+6;zones=[[pad,by+bh+pad,vw-pad,vh-pad]];
  }
  Object.assign($('board').style,{left:bx+'px',top:by+'px',width:bw+'px',height:bh+'px'});
  const pw=bw/G.c,ph=bh/G.r,m=Math.min(pw,ph)*0.3;
  Object.assign(G,{bx,by,bw,bh,pw,ph,m,zones,dpr:Math.min(2,devicePixelRatio||1)});
  const dpr=G.dpr;
  for(const id of ['ghost','full']){const cv=$(id);cv.width=bw*dpr;cv.height=bh*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
    if(id==='full'){x.drawImage(G.im,0,0,bw,bh);continue;}
    if(S.ghost){x.globalAlpha=0.2;x.drawImage(G.im,0,0,bw,bh);x.globalAlpha=1;}
    if(S.grid||G.lv<=1){x.strokeStyle='rgba(120,100,60,.4)';x.lineWidth=1.5;for(let yy=0;yy<G.r;yy++)for(let xx=0;xx<G.c;xx++){x.save();x.translate(xx*pw,yy*ph);x.beginPath();piecePath(x,xx,yy,pw,ph,G.E);x.stroke();x.restore();}}}
  for(const o of G.pieces){
    const W=pw+2*m,H=ph+2*m,cv=o.el;cv.width=Math.ceil(W*dpr);cv.height=Math.ceil(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
    const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.translate(m,m);
    const path=new Path2D();piecePath(path,o.x,o.y,pw,ph,G.E);o.path=path;
    x.save();x.clip(path);const sx=G.im.width/bw;
    x.drawImage(G.im,(o.x*pw-m)*sx,(o.y*ph-m)*sx,(pw+2*m)*sx,(ph+2*m)*sx,-m,-m,pw+2*m,ph+2*m);x.restore();
    x.lineWidth=2;x.strokeStyle='rgba(255,255,255,.7)';x.stroke(path);x.lineWidth=1;x.strokeStyle='rgba(60,45,20,.4)';x.stroke(path);
  }
  const rw=Math.min(vw*0.3,360);$('ref').style.width=rw+'px';
  if(!first){clampAll();render();}
}
// screen pos of a piece's body top-left
const px=(g,o)=>G.bx+(g.ox+o.x/G.c)*G.bw, py=(g,o)=>G.by+g.oy*G.bw+o.y*G.ph;
function scatter(){
  G.groups=[];const placed=[];
  const zs=G.zones.map(z=>({z,a:Math.max(0,z[2]-z[0]-G.pw)*Math.max(0,z[3]-z[1]-G.ph)})).filter(z=>z.a>0);
  const tot=zs.reduce((s,z)=>s+z.a,0);
  const order=G.pieces.slice().sort(()=>Math.random()-0.5);
  for(const o of order){
    let best=null;
    for(let t=0;t<24;t++){let r=Math.random()*tot,Z=zs[0];for(const z of zs){if(r<z.a){Z=z;break;}r-=z.a;}
      const x=Z.z[0]+Math.random()*(Z.z[2]-Z.z[0]-G.pw),y=Z.z[1]+Math.random()*(Z.z[3]-Z.z[1]-G.ph);
      let ov=0;for(const q of placed){const ix=Math.max(0,Math.min(x,q[0])+G.pw-Math.max(x,q[0])+0),iy=Math.max(0,Math.min(y,q[1])+G.ph-Math.max(y,q[1]));ov+=ix*iy;}
      if(!best||ov<best.ov)best={x,y,ov};if(ov===0)break;}
    placed.push([best.x,best.y]);
    const g={ox:(best.x-G.bx)/G.bw-o.x/G.c,oy:(best.y-G.by-o.y*G.ph)/G.bw,ps:[o]};o.g=g;G.groups.push(g);
  }
}
function render(){
  const z=G.zs;z.forEach((g,i)=>{const isPlaced=g.ox===0&&g.oy===0;g.ps.forEach(o=>{o.el.style.transform=`translate(${px(g,o)-G.m}px,${py(g,o)-G.m}px)`;o.el.style.zIndex=isPlaced?1:10+i;
    o.el.classList.toggle('dim',G.edge&&!isPlaced&&g.ps.length===1&&!isEdge(o));});});
}
const isEdge=o=>o.x===0||o.y===0||o.x===G.c-1||o.y===G.r-1;
function clampAll(){for(const g of G.groups)clampGroup(g);}
function clampGroup(g){if(g.ox===0&&g.oy===0)return;let dx=0,dy=0;
  for(const o of g.ps){const x=px(g,o),y=py(g,o);dx=Math.max(dx,4-x);dx=Math.min(dx,innerWidth-4-G.pw-x);dy=Math.max(dy,80-y);dy=Math.min(dy,innerHeight-4-G.ph-y);}
  g.ox+=dx/G.bw;g.oy+=dy/G.bw;}

/* ---------- input ---------- */
let drag=null;
$('hit').addEventListener('pointerdown',e=>{
  if(!G||G.finished||drag)return;ac();
  // topmost piece under pointer (exact shape)
  for(let i=G.zs.length-1;i>=0;i--){const g=G.zs[i];if(g.ox===0&&g.oy===0)continue;
    for(const o of g.ps){if(G.edge&&g.ps.length===1&&!isEdge(o))continue;const lx=e.clientX-px(g,o),ly=e.clientY-py(g,o);
      const pad=G.lv>=3?6:12; // a bit of forgiving margin for small fingers
      if(lx<-G.m||ly<-G.m||lx>G.pw+G.m||ly>G.ph+G.m)continue;
      if(hitCtx.isPointInPath(o.path,lx,ly)||(lx>-pad&&ly>-pad&&lx<G.pw+pad&&ly<G.ph+pad)){startDrag(e,g);return;}}}
});
function snapshot(){return G.groups.map(g=>[g.ox,g.oy,g.ps.map(o=>o.k)]);}
function startDrag(e,g){
  G.undo.push(snapshot());if(G.undo.length>30)G.undo.shift();updUndo();
  $('hit').setPointerCapture(e.pointerId);
  G.zs.splice(G.zs.indexOf(g),1);G.zs.push(g);
  drag={g,id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:g.ox,oy:g.oy};
  g.ps.forEach(o=>{o.el.classList.remove('glide');o.el.classList.add('lift');});
  render();sfx.pick();
}
$('hit').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const g=drag.g;
  g.ox=drag.ox+(e.clientX-drag.sx)/G.bw;g.oy=drag.oy+(e.clientY-drag.sy)/G.bw;render();});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;const g=drag.g;drag=null;g.ps.forEach(o=>o.el.classList.remove('lift'));drop(g);};
$('hit').addEventListener('pointerup',endDrag);$('hit').addEventListener('pointercancel',endDrag);

function tol(){return Math.min(G.pw,G.ph)*SNAP[G.lv]*(S.magnet?1.5:1);}
function drop(g){
  const T=tol();let target=null,boardHit=false;
  // board?
  if(Math.hypot(g.ox*G.bw,g.oy*G.bw)<T)boardHit=true;
  // neighbour groups
  const merges=[];
  for(const h of G.groups){if(h===g)continue;
    if(Math.hypot((g.ox-h.ox)*G.bw,(g.oy-h.oy)*G.bw)<T&&adjacent(g,h))merges.push(h);}
  if(!boardHit&&!merges.length){clampGroup(g);g.ps.forEach(o=>o.el.classList.add('glide'));render();afterMove();return;}
  // decide anchor: board if hit or any merged group is on board
  let anchor=boardHit||merges.some(h=>h.ox===0&&h.oy===0)?{ox:0,oy:0}:merges[0];
  g.ps.forEach(o=>o.el.classList.add('glide'));
  g.ox=anchor.ox;g.oy=anchor.oy;
  for(const h of merges){h.ps.forEach(o=>{o.g=g;g.ps.push(o);});G.groups.splice(G.groups.indexOf(h),1);G.zs.splice(G.zs.indexOf(h),1);}
  const onBoard=g.ox===0&&g.oy===0;
  // also absorb placed group if g lands on board
  if(onBoard){for(const h of G.groups.slice()){if(h!==g&&h.ox===0&&h.oy===0){h.ps.forEach(o=>{o.g=g;g.ps.push(o);});G.groups.splice(G.groups.indexOf(h),1);G.zs.splice(G.zs.indexOf(h),1);}}}
  render();
  setTimeout(()=>g.ps.forEach(o=>{o.el.classList.remove('flash');void o.el.offsetWidth;o.el.classList.add('flash');}),320);
  if(onBoard){sfx.snap();if(!S.quiet){const o=g.ps[g.ps.length-1];sparkle(px(g,o)+G.pw/2,py(g,o)+G.ph/2,2);}}else sfx.join();
  afterMove();
}
function adjacent(g,h){const set=new Set(h.ps.map(o=>o.k));return g.ps.some(o=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const x=o.x+dx,y=o.y+dy;return x>=0&&y>=0&&x<G.c&&y<G.r&&set.has(y*G.c+x);}));}
function placedCount(){const g=G.groups.find(g=>g.ox===0&&g.oy===0);return g?g.ps.length:0;}
function updCount(){$('count').textContent=`${placedCount()} / ${G.pieces.length}`;}
function updUndo(){$('undoBtn').disabled=!G||!G.undo.length||G.finished;}
let saveT;
function afterMove(){
  updCount();updUndo();
  if(placedCount()===G.pieces.length){delete S.saves[G.key];save();setTimeout(finish,600);return;}
  S.saves[G.key]={seed:G.seed,groups:snapshot()};save();
  clearTimeout(saveT);$('saved').style.opacity=1;saveT=setTimeout(()=>$('saved').style.opacity=0,1200);
}
function undo(){
  if(!G||!G.undo.length||G.finished)return;const s=G.undo.pop();
  G.groups=[];s.forEach(t=>{const g={ox:t[0],oy:t[1],ps:t[2].map(k=>G.pieces[k])};g.ps.forEach(o=>{o.g=g;o.el.classList.add('glide');});G.groups.push(g);});
  G.zs=G.groups.slice();render();afterMove();sfx.pick();
}
function hint(){
  if(!G||G.finished)return;G.undo.push(snapshot());
  const placed=G.groups.find(g=>g.ox===0&&g.oy===0);
  let cand=G.groups.filter(g=>!(g.ox===0&&g.oy===0));
  if(placed){const near=cand.filter(g=>adjacent(g,placed));if(near.length)cand=near;}
  else{const ed=cand.filter(g=>g.ps.some(isEdge));if(ed.length)cand=ed;}
  if(!cand.length)return;cand.sort((a,b)=>a.ps.length-b.ps.length);
  const g=cand[0];G.zs.splice(G.zs.indexOf(g),1);G.zs.push(g);g.ps.forEach(o=>o.el.classList.add('glide'));
  g.ox=0;g.oy=0;drop(g);
}
function finish(){
  G.finished=true;updUndo();$('full').style.opacity=1;
  setTimeout(()=>{if(G&&G.finished)G.pieces.forEach(o=>o.el.style.opacity=0)},1200);
  const sk=G.p.id+'_'+G.lv,isNew=!S.stickers[sk];S.stickers[sk]=Date.now();save();
  sfx.done();
  const msgs=['拼好啦！🎉','太棒了！🌟','你真厉害！👏','完成啦！🦕','好厉害的拼图高手！🧩'];
  $('doneT').textContent=msgs[Math.floor(Math.random()*msgs.length)];$('doneP').textContent=G.p.praise;
  const n=Object.keys(S.stickers).length;
  $('doneStk').innerHTML=`<div class="sticker${isNew?' pop':''}" style="background-image:url('${THUMBS[G.p.id]}')"><b>${LEVELS[G.lv]}</b></div><div>${isNew?'得到一张新贴纸！':'这张贴纸已经有啦'}<br><span style="font-weight:400;color:#8a8f7d">贴纸本里一共 ${n} 张</span></div>`;
  $('harderBtn').style.display=G.lv<LEVELS.length-1?'':'none';$('harderBtn').textContent=`试试 ${LEVELS[G.lv+1]||''} 块`;
  setTimeout(()=>{$('doneBox').classList.add('show');if(isNew)setTimeout(sfx.sticker,500);},900);
  speak('拼好啦，你真棒！'+G.p.praise);
  if(!S.quiet)for(let i=0;i<14;i++)setTimeout(()=>sparkle(G.bx+Math.random()*G.bw,G.by+G.bh*(0.4+Math.random()*0.6),1),i*120);
}
function sparkle(x,y,n){const em=['⭐','✨','🌟','💛'];for(let i=0;i<n;i++){const s=document.createElement('div');s.className='star';s.textContent=em[Math.floor(Math.random()*4)];s.style.left=(x-14+(Math.random()-0.5)*40)+'px';s.style.top=(y-14)+'px';$('fx').appendChild(s);setTimeout(()=>s.remove(),2500);}}

/* ---------- sticker book ---------- */
function buildBook(){
  const w=$('bookWrap');w.innerHTML='';let got=0;
  for(const [set,title] of SETS){const ps=PICS.filter(p=>p.set===set);if(!ps.length)continue;
    const h=document.createElement('div');h.className='sec';h.textContent=title;w.appendChild(h);
    const r=document.createElement('div');r.className='bgrid';w.appendChild(r);
    ps.forEach(p=>{const ks=LEVELS.map((n,k)=>k).filter(k=>S.stickers[p.id+'_'+k]);const d=document.createElement('div');d.className='bcell';
      if(ks.length){got++;const best=Math.max(...ks);d.innerHTML=`<div class="sticker" style="background-image:url('${THUMBS[p.id]}')"><b>${LEVELS[best]}</b></div><span>${p.name}</span>`;}
      else d.innerHTML=`<div class="slot">?</div><span>${p.name}</span>`;
      r.appendChild(d);});}
  $('bookCount').textContent=`已收集 ${got} / ${PICS.length}`;
}
/* ---------- wiring ---------- */
function goHome(){if(G)G=null;$('doneBox').classList.remove('show');$('play').classList.remove('show');$('book').classList.remove('show');$('home').classList.add('show');buildHome();}
$('backBtn').onclick=goHome;
$('bookBtn').onclick=()=>{buildBook();$('home').classList.remove('show');$('book').classList.add('show');};
$('bookBack').onclick=goHome;
$('againBtn').onclick=()=>startGame(G.pi,true);
$('nextBtn').onclick=()=>{const p=G.p,list=PICS.filter(q=>q.set===p.set),i=list.indexOf(p);startGame(PICS.indexOf(list[(i+1)%list.length]));};
$('harderBtn').onclick=()=>{S.lv=Math.min(LEVELS.length-1,G.lv+1);save();startGame(G.pi);};
$('hintBtn').onclick=hint;$('undoBtn').onclick=undo;
$('refBtn').onclick=()=>{const on=!$('ref').classList.contains('show');$('ref').classList.toggle('show',on);$('refBtn').classList.toggle('on',on);};
$('edgeBtn').onclick=()=>{G.edge=!G.edge;$('edgeBtn').classList.toggle('on',G.edge);render();};
function soundIcon(){$('soundBtn').querySelector('.e').textContent=(S.sound&&!S.quiet)?'🔈':'🔇';}
$('soundBtn').onclick=()=>{if(S.quiet){S.quiet=false;S.sound=true;}else S.sound=!S.sound;save();applySettings();if(S.sound){ac();sfx.pick();}};
function applySettings(){document.body.classList.toggle('quiet',S.quiet);document.querySelectorAll('.tg').forEach(t=>t.classList.toggle('on',!!S[t.dataset.k]));soundIcon();setMusic();}
document.querySelectorAll('.tg').forEach(t=>t.onclick=()=>{const k=t.dataset.k;S[k]=!S[k];save();applySettings();if((k==='ghost'||k==='grid')&&G)layout();if((k==='sound'||k==='voice')&&S[k])ac();});
$('setBtn1').onclick=$('setBtn2').onclick=()=>$('setBox').classList.add('show');
$('setClose').onclick=()=>$('setBox').classList.remove('show');
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>layout(false),120);});
addEventListener('contextmenu',e=>e.preventDefault());
$('credits').innerHTML=(window.PUZZLE_CREDITS||'')+'<br>· 「我的图片」只保存在这台电脑的浏览器里，不会上传。';
applySettings();buildHome();
DB.open().then(loadMine).then(buildHome);
</script>
